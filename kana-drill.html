  <style>
    .drill-page { max-width: 720px; margin: 0 auto; padding: 2rem; }
    .drill-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .drill-scores { display: flex; gap: 0.75rem; align-items: stretch; }
    .drill-score-box { background: var(--ink); color: var(--paper); border-radius: 8px; padding: 0.6rem 1.1rem; text-align: center; min-width: 84px; }
    .drill-score-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.7; }
    .drill-score-value { font-size: 1.25rem; font-weight: 700; }
    .drill-score-box.streak .drill-score-value { color: var(--gold); }

    .drill-controls { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.5rem; }
    .drill-control-row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
    .drill-control-label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-light); min-width: 60px; }
    .drill-chip { border: 1.5px solid rgba(0,0,0,0.15); background: white; color: var(--text); padding: 0.45rem 1rem; border-radius: 999px; font-family: inherit; font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: all 0.15s; }
    .drill-chip:hover { border-color: var(--accent-soft); }
    .drill-chip.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }
    .drill-chip.on.set-chip { background: var(--sage); border-color: var(--sage); }

    .drill-card { background: white; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 2.5rem 2rem; text-align: center; margin-bottom: 1.25rem; }
    .drill-question-tag { display: inline-block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); background: rgba(196,92,74,0.1); padding: 0.3rem 0.9rem; border-radius: 999px; margin-bottom: 1rem; }
    .drill-question { font-size: 4.5rem; line-height: 1.15; color: var(--ink); min-height: 5.2rem; }
    .drill-question.romaji-q { font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 3.5rem; font-style: italic; color: var(--ink); }

    .drill-choices { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.75rem; margin-bottom: 1.25rem; }
    .drill-choice { background: white; border: 2px solid rgba(0,0,0,0.12); border-radius: 10px; padding: 1rem 0.5rem; font-size: 2.2rem; cursor: pointer; transition: all 0.15s; color: var(--ink); }
    .drill-choice:hover:not(:disabled) { border-color: var(--accent-soft); transform: translateY(-2px); }
    .drill-choice:disabled { cursor: default; }
    .drill-choice.correct { background: rgba(122,158,126,0.18); border-color: var(--sage); }
    .drill-choice.wrong { background: rgba(196,92,74,0.12); border-color: var(--accent); }
    .drill-choice.dim { opacity: 0.45; }

    .drill-answer-row { display: flex; gap: 0.75rem; margin-bottom: 1.25rem; }
    .drill-input { flex: 1; padding: 1rem 1.25rem; font-size: 1.4rem; border: 2px solid rgba(0,0,0,0.15); border-radius: 10px; font-family: 'Outfit', sans-serif; outline: none; text-align: center; letter-spacing: 0.05em; }
    .drill-input:focus { border-color: var(--accent); }
    .drill-input:disabled { background: var(--paper-warm); }
    .drill-input.correct { border-color: var(--sage); background: rgba(122,158,126,0.1); }
    .drill-input.wrong { border-color: var(--accent); background: rgba(196,92,74,0.08); }

    .drill-feedback { border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; display: none; text-align: center; }
    .drill-feedback.show { display: block; }
    .drill-feedback.good { background: rgba(122,158,126,0.15); border: 1px solid var(--sage); color: #3f5c42; }
    .drill-feedback.bad { background: rgba(196,92,74,0.1); border: 1px solid var(--accent-soft); color: #8a3d2f; }
    .drill-feedback .big { font-size: 1.6rem; margin-top: 0.25rem; }
    .drill-audio-btn { background: none; border: none; cursor: pointer; font-size: 1.1rem; padding: 0.2rem 0.4rem; vertical-align: middle; }

    .drill-actions { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    .drill-btn { flex: 1; padding: 1rem; font-family: inherit; font-size: 1rem; font-weight: 600; border-radius: 10px; border: none; cursor: pointer; transition: all 0.15s; min-width: 140px; }
    .drill-btn.primary { background: var(--accent); color: white; }
    .drill-btn.primary:hover:not(:disabled) { background: var(--accent-soft); }
    .drill-btn.primary:disabled { opacity: 0.45; cursor: default; }
    .drill-btn.ghost { background: white; border: 1.5px solid rgba(0,0,0,0.15); color: var(--text); }
    .drill-btn.ghost:hover { border-color: var(--accent-soft); }

    .drill-missed { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); padding: 1.5rem 2rem; margin-top: 2rem; display: none; }
    .drill-missed.show { display: block; }
    .drill-missed h2 { font-size: 1.1rem; color: var(--ink); margin-bottom: 0.75rem; }
    .drill-missed-list { display: flex; flex-wrap: wrap; gap: 0.6rem; }
    .drill-missed-chip { background: var(--paper-warm); border: 1px solid rgba(0,0,0,0.1); border-radius: 8px; padding: 0.4rem 0.8rem; font-size: 1rem; cursor: pointer; }
    .drill-missed-chip .jp { font-size: 1.35rem; margin-right: 0.4rem; }
    .drill-missed-chip small { color: var(--text-light); font-style: italic; }

    @media (max-width: 540px) {
      .drill-page { padding: 1.25rem; }
      .drill-question { font-size: 3.5rem; }
      .drill-question.romaji-q { font-size: 2.6rem; }
      .drill-choices { grid-template-columns: repeat(2, 1fr); }
    }
  </style>

  <script>
  // ==========================================================================
  // KANA DRILL — self-contained practice engine
  // Reuses playKanaAudio() from app.js for pronunciation.
  // ==========================================================================
  (function () {
    'use strict';

    var KANA = {
      basic: [
        {r:'a',h:'あ',k:'ア'},{r:'i',h:'い',k:'イ'},{r:'u',h:'う',k:'ウ'},{r:'e',h:'え',k:'エ'},{r:'o',h:'お',k:'オ'},
        {r:'ka',h:'か',k:'カ'},{r:'ki',h:'き',k:'キ'},{r:'ku',h:'く',k:'ク'},{r:'ke',h:'け',k:'ケ'},{r:'ko',h:'こ',k:'コ'},
        {r:'sa',h:'さ',k:'サ'},{r:'shi',h:'し',k:'シ'},{r:'su',h:'す',k:'ス'},{r:'se',h:'せ',k:'セ'},{r:'so',h:'そ',k:'ソ'},
        {r:'ta',h:'た',k:'タ'},{r:'chi',h:'ち',k:'チ'},{r:'tsu',h:'つ',k:'ツ'},{r:'te',h:'て',k:'テ'},{r:'to',h:'と',k:'ト'},
        {r:'na',h:'な',k:'ナ'},{r:'ni',h:'に',k:'ニ'},{r:'nu',h:'ぬ',k:'ヌ'},{r:'ne',h:'ね',k:'ネ'},{r:'no',h:'の',k:'ノ'},
        {r:'ha',h:'は',k:'ハ'},{r:'hi',h:'ひ',k:'ヒ'},{r:'fu',h:'ふ',k:'フ'},{r:'he',h:'へ',k:'ヘ'},{r:'ho',h:'ほ',k:'ホ'},
        {r:'ma',h:'ま',k:'マ'},{r:'mi',h:'み',k:'ミ'},{r:'mu',h:'む',k:'ム'},{r:'me',h:'め',k:'メ'},{r:'mo',h:'も',k:'モ'},
        {r:'ya',h:'や',k:'ヤ'},{r:'yu',h:'ゆ',k:'ユ'},{r:'yo',h:'よ',k:'ヨ'},
        {r:'ra',h:'ら',k:'ラ'},{r:'ri',h:'り',k:'リ'},{r:'ru',h:'る',k:'ル'},{r:'re',h:'れ',k:'レ'},{r:'ro',h:'ろ',k:'ロ'},
        {r:'wa',h:'わ',k:'ワ'},{r:'wo',h:'を',k:'ヲ'},{r:'n',h:'ん',k:'ン'}
      ],
      dakuten: [
        {r:'ga',h:'が',k:'ガ'},{r:'gi',h:'ぎ',k:'ギ'},{r:'gu',h:'ぐ',k:'グ'},{r:'ge',h:'げ',k:'ゲ'},{r:'go',h:'ご',k:'ゴ'},
        {r:'za',h:'ざ',k:'ザ'},{r:'ji',h:'じ',k:'ジ'},{r:'zu',h:'ず',k:'ズ'},{r:'ze',h:'ぜ',k:'ゼ'},{r:'zo',h:'ぞ',k:'ゾ'},
        {r:'da',h:'だ',k:'ダ'},{r:'ji',h:'ぢ',k:'ヂ',alt:['di']},{r:'zu',h:'づ',k:'ヅ',alt:['du']},{r:'de',h:'で',k:'デ'},{r:'do',h:'ど',k:'ド'},
        {r:'ba',h:'ば',k:'バ'},{r:'bi',h:'び',k:'ビ'},{r:'bu',h:'ぶ',k:'ブ'},{r:'be',h:'べ',k:'ベ'},{r:'bo',h:'ぼ',k:'ボ'},
        {r:'pa',h:'ぱ',k:'パ'},{r:'pi',h:'ぴ',k:'ピ'},{r:'pu',h:'ぷ',k:'プ'},{r:'pe',h:'ぺ',k:'ペ'},{r:'po',h:'ぽ',k:'ポ'}
      ],
      combos: [
        {r:'kya',h:'きゃ',k:'キャ'},{r:'kyu',h:'きゅ',k:'キュ'},{r:'kyo',h:'きょ',k:'キョ'},
        {r:'sha',h:'しゃ',k:'シャ'},{r:'shu',h:'しゅ',k:'シュ'},{r:'sho',h:'しょ',k:'ショ'},
        {r:'cha',h:'ちゃ',k:'チャ'},{r:'chu',h:'ちゅ',k:'チュ'},{r:'cho',h:'ちょ',k:'チョ'},
        {r:'nya',h:'にゃ',k:'ニャ'},{r:'nyu',h:'にゅ',k:'ニュ'},{r:'nyo',h:'にょ',k:'ニョ'},
        {r:'hya',h:'ひゃ',k:'ヒャ'},{r:'hyu',h:'ひゅ',k:'ヒュ'},{r:'hyo',h:'ひょ',k:'ヒョ'},
        {r:'mya',h:'みゃ',k:'ミャ'},{r:'myu',h:'みゅ',k:'ミュ'},{r:'myo',h:'みょ',k:'ミョ'},
        {r:'rya',h:'りゃ',k:'リャ'},{r:'ryu',h:'りゅ',k:'リュ'},{r:'ryo',h:'りょ',k:'リョ'},
        {r:'gya',h:'ぎゃ',k:'ギャ'},{r:'gyu',h:'ぎゅ',k:'ギュ'},{r:'gyo',h:'ぎょ',k:'ギョ'},
        {r:'ja',h:'じゃ',k:'ジャ'},{r:'ju',h:'じゅ',k:'ジュ'},{r:'jo',h:'じょ',k:'ジョ'},
        {r:'bya',h:'びゃ',k:'ビャ'},{r:'byu',h:'びゅ',k:'ビュ'},{r:'byo',h:'びょ',k:'ビョ'},
        {r:'pya',h:'ぴゃ',k:'ピャ'},{r:'pyu',h:'ぴゅ',k:'ピュ'},{r:'pyo',h:'ぴょ',k:'ピョ'}
      ]
    };

    // Kunrei-shiki / common alternate spellings, all accepted as correct.
    var ALT_SPELLINGS = {
      shi:['si'], chi:['ti'], tsu:['tu'], fu:['hu'], ji:['zi'],
      sha:['sya'], shu:['syu'], sho:['syo'],
      cha:['tya'], chu:['tyu'], cho:['tyo'],
      ja:['zya','jya'], ju:['zyu','jyu'], jo:['zyo','jyo']
    };

    var state = {
      mode: 'kana2romaji',
      script: 'hiragana',
      sets: { basic: true, dakuten: false, combos: false },
      correct: 0, total: 0, streak: 0, best: 0,
      current: null,       // { item, script, prompt }
      answered: false,
      missed: {}           // key: hiragana → item
    };

    // Restore best streak if the browser allows it
    try {
      var saved = localStorage.getItem('kanaDrillBest');
      if (saved) state.best = parseInt(saved, 10) || 0;
    } catch (e) { /* storage unavailable — fine */ }

    function $(id) { return document.getElementById(id); }

    function pool() {
      var out = [];
      if (state.sets.basic) out = out.concat(KANA.basic);
      if (state.sets.dakuten) out = out.concat(KANA.dakuten);
      if (state.sets.combos) out = out.concat(KANA.combos);
      return out;
    }

    function accepted(item) {
      var list = [item.r];
      if (ALT_SPELLINGS[item.r]) list = list.concat(ALT_SPELLINGS[item.r]);
      if (item.alt) list = list.concat(item.alt);
      return list;
    }

    function pickScript() {
      if (state.script === 'mixed') return Math.random() < 0.5 ? 'h' : 'k';
      return state.script === 'katakana' ? 'k' : 'h';
    }

    function playAudio(item) {
      if (typeof playKanaAudio === 'function') playKanaAudio(item.h);
    }

    // ---------- question generation ----------
    function newQuestion() {
      var p = pool();
      var item = p[Math.floor(Math.random() * p.length)];
      // Avoid immediate repeats
      if (state.current && p.length > 3) {
        while (item.h === state.current.item.h) {
          item = p[Math.floor(Math.random() * p.length)];
        }
      }
      var sc = pickScript();
      state.current = { item: item, script: sc };
      state.answered = false;

      var fb = $('drill-feedback');
      fb.className = 'drill-feedback';
      fb.innerHTML = '';

      if (state.mode === 'kana2romaji') {
        $('drill-tag').textContent = sc === 'h' ? 'Hiragana — type the reading' : 'Katakana — type the reading';
        var q = $('drill-question');
        q.className = 'drill-question jp';
        q.textContent = sc === 'h' ? item.h : item.k;
        $('drill-type-row').style.display = 'flex';
        $('drill-choices').style.display = 'none';
        var input = $('drill-input');
        input.value = '';
        input.disabled = false;
        input.className = 'drill-input';
        input.focus();
        $('drill-check').style.display = 'block';
        $('drill-check').disabled = true;
        $('drill-check').textContent = 'Check Answer';
        $('drill-skip').style.display = 'block';
      } else {
        $('drill-tag').textContent = sc === 'h' ? 'Pick the hiragana' : 'Pick the katakana';
        var q2 = $('drill-question');
        q2.className = 'drill-question romaji-q';
        q2.textContent = item.r;
        $('drill-type-row').style.display = 'none';
        $('drill-choices').style.display = 'grid';
        buildChoices(item, sc, p);
        $('drill-check').style.display = 'none';
        $('drill-skip').style.display = 'block';
      }
    }

    function buildChoices(answer, sc, p) {
      var distractors = [];
      var used = { };
      used[answer.h] = true;
      var usedRomaji = { };
      usedRomaji[answer.r] = true;
      var guard = 0;
      while (distractors.length < 3 && guard < 200) {
        guard++;
        var cand = p[Math.floor(Math.random() * p.length)];
        if (used[cand.h] || usedRomaji[cand.r]) continue;
        used[cand.h] = true;
        usedRomaji[cand.r] = true;
        distractors.push(cand);
      }
      var options = distractors.concat([answer]);
      // shuffle
      for (var i = options.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = options[i]; options[i] = options[j]; options[j] = t;
      }
      var box = $('drill-choices');
      box.innerHTML = '';
      options.forEach(function (opt) {
        var b = document.createElement('button');
        b.className = 'drill-choice jp';
        b.textContent = sc === 'h' ? opt.h : opt.k;
        b.onclick = function () { chooseKana(opt, b); };
        box.appendChild(b);
      });
    }

    // ---------- answering ----------
    function chooseKana(opt, btn) {
      if (state.answered) return;
      state.answered = true;
      var item = state.current.item;
      var right = opt.h === item.h;
      var buttons = $('drill-choices').querySelectorAll('.drill-choice');
      buttons.forEach(function (b) {
        b.disabled = true;
        var isAnswer = b.textContent === (state.current.script === 'h' ? item.h : item.k);
        if (isAnswer) b.classList.add('correct');
        else if (b === btn) b.classList.add('wrong');
        else b.classList.add('dim');
      });
      record(right);
      showFeedback(right);
    }

    function checkDrillAnswer() {
      if (state.answered || state.mode !== 'kana2romaji') return;
      var input = $('drill-input');
      var val = input.value.trim().toLowerCase().replace(/\s+/g, '');
      if (!val) return;
      state.answered = true;
      var item = state.current.item;
      var right = accepted(item).indexOf(val) !== -1;
      input.disabled = true;
      input.classList.add(right ? 'correct' : 'wrong');
      record(right);
      showFeedback(right);
    }

    function skipDrill() {
      if (state.answered) return;
      state.answered = true;
      var item = state.current.item;
      if (state.mode === 'kana2romaji') {
        var input = $('drill-input');
        input.disabled = true;
      } else {
        var buttons = $('drill-choices').querySelectorAll('.drill-choice');
        buttons.forEach(function (b) {
          b.disabled = true;
          var isAnswer = b.textContent === (state.current.script === 'h' ? item.h : item.k);
          if (isAnswer) b.classList.add('correct'); else b.classList.add('dim');
        });
      }
      record(false);
      showFeedback(false, true);
    }

    function record(right) {
      state.total++;
      if (right) {
        state.correct++;
        state.streak++;
        if (state.streak > state.best) {
          state.best = state.streak;
          try { localStorage.setItem('kanaDrillBest', String(state.best)); } catch (e) {}
        }
      } else {
        state.streak = 0;
        var item = state.current.item;
        state.missed[item.h] = item;
        renderMissed();
      }
      renderScores();
    }

    function showFeedback(right, skipped) {
      var item = state.current.item;
      var sc = state.current.script;
      var shown = sc === 'h' ? item.h : item.k;
      var fb = $('drill-feedback');
      fb.className = 'drill-feedback show ' + (right ? 'good' : 'bad');
      var head = right ? '⭕ Correct!' : (skipped ? 'Answer:' : '❌ Not quite — the answer is:');
      fb.innerHTML =
        '<div>' + head + '</div>' +
        '<div class="big"><span class="jp">' + shown + '</span> = <strong>' + item.r + '</strong>' +
        '<button class="drill-audio-btn" title="Hear pronunciation" aria-label="Hear pronunciation">🔊</button></div>';
      fb.querySelector('.drill-audio-btn').onclick = function () { playAudio(item); };
      playAudio(item);
      // Repurpose the primary button as "Next"
      var check = $('drill-check');
      check.style.display = 'block';
      check.disabled = false;
      check.textContent = 'Next Question →';
      check.focus();
      $('drill-skip').style.display = 'none';
    }

    function renderScores() {
      $('drill-correct').textContent = state.correct;
      $('drill-total').textContent = state.total;
      $('drill-streak').textContent = state.streak;
      $('drill-best').textContent = state.best;
    }

    function renderMissed() {
      var keys = Object.keys(state.missed);
      var box = $('drill-missed');
      if (!keys.length) { box.className = 'drill-missed'; return; }
      box.className = 'drill-missed show';
      var list = $('drill-missed-list');
      list.innerHTML = '';
      keys.forEach(function (h) {
        var item = state.missed[h];
        var chip = document.createElement('button');
        chip.className = 'drill-missed-chip';
        chip.title = 'Click to hear';
        chip.innerHTML = '<span class="jp">' + item.h + '・' + item.k + '</span><small>' + item.r + '</small>';
        chip.onclick = function () { playAudio(item); };
        list.appendChild(chip);
      });
    }

    // ---------- controls ----------
    window.setMode = function (mode) {
      state.mode = mode;
      document.querySelectorAll('.mode-chip').forEach(function (c) {
        c.classList.toggle('on', c.getAttribute('data-mode') === mode);
      });
      newQuestion();
    };

    window.setScript = function (script) {
      state.script = script;
      document.querySelectorAll('.script-chip').forEach(function (c) {
        c.classList.toggle('on', c.getAttribute('data-script') === script);
      });
      newQuestion();
    };

    window.toggleSet = function (set) {
      // Never allow zero sets selected
      var onCount = Object.keys(state.sets).filter(function (s) { return state.sets[s]; }).length;
      if (state.sets[set] && onCount === 1) {
        if (typeof showToast === 'function') showToast('At least one set must stay on', 'warning');
        return;
      }
      state.sets[set] = !state.sets[set];
      document.querySelectorAll('.set-chip').forEach(function (c) {
        var s = c.getAttribute('data-set');
        c.classList.toggle('on', !!state.sets[s]);
      });
      newQuestion();
    };

    window.checkDrillAnswer = checkDrillAnswer;
    window.skipDrill = skipDrill;

    window.resetDrill = function () {
      state.correct = 0; state.total = 0; state.streak = 0;
      state.missed = {};
      renderScores();
      renderMissed();
      newQuestion();
    };

    // ---------- wiring ----------
    function init() {
      var input = $('drill-input');
      input.addEventListener('input', function () {
        if (!state.answered) $('drill-check').disabled = input.value.trim() === '';
      });
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          if (state.answered) newQuestion();
          else checkDrillAnswer();
        }
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && state.answered && document.activeElement !== input) {
          newQuestion();
        }
      });
      // The primary button doubles as Check / Next
      $('drill-check').addEventListener('click', function () {
        if (state.answered) newQuestion();
      });
      renderScores();
      newQuestion();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
  </script>

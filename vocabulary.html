    <style>
      /* ---- the Word Book: page-local layout on top of words-theme.css ---- */
      #page-vocabulary .wd-search-wrap { position: relative; flex: 0 1 19rem; }
      #page-vocabulary .vocab-search {
        width: 100%; background: var(--wd-ink-2); border: 1.5px solid var(--wd-line); border-radius: 999px;
        padding: 0.5rem 0.95rem; font-family: 'Outfit', sans-serif; font-size: 0.85rem; color: var(--wd-cream);
      }
      #page-vocabulary .vocab-search:focus { outline: none; border-color: var(--wd-cream); }
      #page-vocabulary .vocab-search::placeholder { color: var(--wd-faint); }
      #page-vocabulary .vocab-search-results {
        position: absolute; top: calc(100% + 6px); left: 0; right: 0; max-height: 21rem; overflow-y: auto; z-index: 30;
        background: var(--wd-paper); color: var(--wd-text); border: 2px solid #1a1512; border-radius: 12px;
        box-shadow: var(--wd-shadow); padding: 0.3rem;
      }
      #page-vocabulary .vocab-search-hit {
        display: grid; grid-template-columns: 6.5rem 6rem 1fr auto; gap: 0.5rem; align-items: baseline; width: 100%;
        text-align: left; background: none; border: 0; border-radius: 8px; padding: 0.45rem 0.6rem; cursor: pointer;
        font-family: 'Outfit', sans-serif; color: var(--wd-text);
      }
      #page-vocabulary .vocab-search-hit:hover, #page-vocabulary .vocab-search-hit.on { background: #eee6d4; }
      #page-vocabulary .vs-jp { font-size: 1.05rem; font-weight: 600; }
      #page-vocabulary .vs-kj { color: var(--wd-red); font-size: 0.95rem; }
      #page-vocabulary .vs-en { font-size: 0.85rem; }
      #page-vocabulary .vs-lv { font-size: 0.62rem; letter-spacing: 0.1em; color: var(--wd-faint); border: 1px solid var(--wd-paper-line); border-radius: 999px; padding: 1px 6px; }
      #page-vocabulary .vocab-search-empty, #page-vocabulary .vocab-search-more { padding: 0.5rem 0.7rem; font-size: 0.8rem; color: var(--wd-faint); }

      /* the sheet's two faces */
      #page-vocabulary #flashcard-vocab .wd-front { min-height: 6rem; }
      #page-vocabulary .wd-options { margin-top: 0.9rem; }
      #page-vocabulary .drill-chip.info-chip { border-color: var(--wd-line); color: var(--wd-mute); width: 30px; height: 30px; }
      #page-vocabulary .drill-chip.info-chip:hover { border-color: var(--wd-cream); color: var(--wd-cream); background: transparent; }
      #page-vocabulary .ka-audio-panel { justify-content: center; }
      /* the stamp strip folds away; a chevron in its heading is the handle */
      #page-vocabulary .wd-strip-toggle {
        display: inline-flex; align-items: center; gap: 0.5rem; background: none; border: 0; padding: 0;
        color: inherit; font: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer;
      }
      #page-vocabulary .wd-strip-toggle:hover { color: var(--wd-cream); }
      #page-vocabulary .wd-strip-chev { display: inline-block; width: 1em; transition: transform 0.15s; color: var(--wd-red); }
      #page-vocabulary .wd-strip-toggle[aria-expanded="false"] .wd-strip-chev { transform: rotate(-90deg); }
      #page-vocabulary .wd-strip-count { color: var(--wd-faint); letter-spacing: 0.04em; text-transform: none; }
      #page-vocabulary .wd-stamps.is-folded { display: none; }
      #page-vocabulary .wd-quiz-link { text-align: center; margin-top: 1.6rem; font-size: 0.82rem; }
      #page-vocabulary .wd-quiz-link a { color: var(--wd-mute); text-decoration: none; border-bottom: 1px dotted var(--wd-line); }
      #page-vocabulary .wd-quiz-link a:hover { color: var(--wd-cream); border-color: var(--wd-cream); }
      @media (max-width: 640px) {
        #page-vocabulary .wd-search-wrap { flex: 1 1 100%; }
        #page-vocabulary .vocab-search-hit { grid-template-columns: 1fr 1fr; }
        #page-vocabulary .vs-en { grid-column: 1 / -1; }
      }

  <script>
    // ---- the Word Book's page script: draws what app.js decides ----------
    (function () {
      'use strict';
      var railHost, currentCard = null, currentOpts = {};
      var $ = function (id) { return document.getElementById(id); };
      var ct = function (k, f) { return window.KA_ct ? KA_ct(k, f) : f; };

      function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

      // One square per character. Long words get smaller squares rather than
      // a second row, up to a point.
      function cells(text) {
        var host = $('wb-cells');
        if (!host) return;
        var chars = Array.from(String(text || ''));
        var n = chars.length;
        var size = n <= 5 ? 72 : n <= 7 ? 60 : n <= 9 ? 50 : 42;
        host.style.setProperty('--cell', size + 'px');
        host.innerHTML = chars.map(function (c) { return '<span class="wd-cell">' + esc(c) + '</span>'; }).join('');
      }

      function onCard(card, opts) {
        currentCard = card; currentOpts = opts || {};
        var sheet = $('flashcard-vocab');
        var front = $('wb-front-text'), cellsEl = $('wb-cells');
        var lab = $('wb-answer-lab'), sub = $('wb-answer-sub');
        if (opts.reverse) {
          // meaning first: the English is the front, the word is the answer
          cellsEl.style.display = 'none';
          front.style.display = '';
          front.textContent = card.english;
          front.classList.remove('jp');
          if (lab) { lab.setAttribute('data-i18n', 'wb_word'); lab.textContent = ct('wb_word', 'The word'); }
          $('card-english-vocab').classList.add('jp');
          if (sub) sub.textContent = '';
        } else {
          front.style.display = 'none';
          cellsEl.style.display = '';
          cells(card.japanese);
          if (lab) { lab.setAttribute('data-i18n', 'wb_meaning'); lab.textContent = ct('wb_meaning', 'Meaning'); }
          $('card-english-vocab').classList.remove('jp');
          // the written form goes under the meaning when it isn't already on the front
          var written = card.kanji || card.katakana || '';
          var shown = (opts.kanji && card.kanji) || (opts.katakana && card.katakana);
          if (sub) sub.innerHTML = (written && !shown) ? '<span class="jp">' + esc(written) + '</span>' : '';
        }
        // topic · word class
        var deckName = window.KA_Words ? KA_Words.deckName(card.topic) : card.topic;
        var deckJp = window.KA_Words ? (KA_Words.deck(card.topic).jp || '') : '';
        var cat = $('card-category-vocab') ? $('card-category-vocab').textContent : '';
        $('wb-meta').innerHTML = esc(deckName) + (deckJp ? ' · <span class="jp">' + esc(deckJp) + '</span>' : '') + (cat ? ' · ' + esc(cat) : '');
        // the teacher's mark
        var st = window.KA_Words ? KA_Words.status(card) : 'new';
        sheet.classList.toggle('is-solid', st === 'solid');
        sheet.classList.toggle('is-shaky', st === 'shaky');
        sheet.classList.remove('flipped');
        $('wb-answer').setAttribute('data-hint', ct('wb_flip_hint', 'tap to flip · alt+f'));
        paintStamps();
      }

      function paintStamps() {
        var host = $('wb-stamps');
        if (!host || !window.KA_Vocab || !window.KA_Words) return;
        var cards = KA_Vocab.cards();
        var cur = KA_Vocab.current();
        var counts = { solid: 0, shaky: 0, 'new': 0 };
        var html = '';
        for (var i = 0; i < cards.length; i++) {
          var c = cards[i], st = KA_Words.status(c);
          counts[st]++;
          html += '<button type="button" class="wd-stamp st-' + st + (c === cur ? ' is-here' : '') + '" data-i="' + i +
            '" style="--c:' + KA_Words.stampColour(c) + ';--tilt:' + KA_Words.tilt(c) + 'deg" title="' +
            esc((c.kanji || c.katakana || c.japanese) + ' · ' + c.english) + '">' + esc(KA_Words.stampChar(c)) + '</button>';
        }
        host.innerHTML = html;
        var known = $('wb-known');
        if (known) known.textContent = counts.solid + ' ' + ct('wb_known', 'known') + (counts.shaky ? ' · ' + counts.shaky + ' ' + ct('kw_s_shaky', 'shaky').toLowerCase() : '');
        var bar = $('wb-bar');
        if (bar) bar.style.width = (cards.length ? Math.round(counts.solid / cards.length * 100) : 0) + '%';
        var cnt = $('wb-strip-count');
        if (cnt) cnt.textContent = '· ' + cards.length + ' · ' + counts.solid + ' ' + ct('wb_known', 'known') + (counts.shaky ? ' · ' + counts.shaky + ' ' + ct('kw_s_shaky', 'shaky').toLowerCase() : '');
        var name = $('wb-deck-name');
        if (name) {
          var d = KA_Words.deck(KA_Vocab.deck());
          name.textContent = (d.jp ? d.jp + ' ' : '') + KA_Words.deckName(KA_Vocab.deck());
        }
      }

      function onDeck(key) {
        if (railHost && window.KA_Words) KA_Words.paintRail(railHost, key);
        paintStamps();
      }

      function onGrade(card, right) {
        if (railHost && window.KA_Words) KA_Words.paintRail(railHost, KA_Vocab.deck());
      }

      function onProgress(i, n) {
        var p = $('progress-vocab');
        if (p) p.textContent = (i + 1) + ' / ' + n;
      }

      function init() {
        railHost = $('wb-rail');
        if (railHost && window.KA_Words) {
          KA_Words.renderRail(railHost, {
            current: window.KA_Vocab ? KA_Vocab.deck() : 'all',
            onPick: function (key) { if (window.KA_Vocab) KA_Vocab.setDeck(key); }
          });
        }
        var sub = $('wb-sub');
        if (sub && window.KA_Words) {
          var all = KA_Words.deckCards('all').length, decks = KA_Words.DECKS.length - 1;
          sub.textContent = all + ' ' + ct('wb_words', 'words') + ' · ' + decks + ' ' + ct('wb_decks', 'decks');
        }
        var on = function (id, fn) { var el = $(id); if (el) el.addEventListener('click', fn); };
        on('wb-yes', function () { if (window.KA_Vocab) KA_Vocab.grade(true); });
        on('wb-no', function () { if (window.KA_Vocab) KA_Vocab.grade(false); });
        on('wb-flip', function () { if (window.KA_Vocab) KA_Vocab.flip(); });
        // the voice chip opens the same panel the old caret did
        var caret = $('vocab-audio-caret'), vbtn = $('wb-voice-btn'), split = $('vocab-listen-split');
        if (vbtn && caret) {
          vbtn.addEventListener('click', function () { caret.click(); });
          var sync = function () { vbtn.style.display = (split && split.style.display !== 'none') ? '' : 'none'; };
          sync();
          new MutationObserver(sync).observe(split, { attributes: true, attributeFilter: ['style'] });
        }
        // the strip starts folded, and remembers whichever way you left it
        var STRIP_KEY = 'katsuyo-vocab-strip';
        var tg = $('wb-strip-toggle'), strip = $('wb-stamps');
        if (tg && strip) {
          var open = false;
          try { open = localStorage.getItem(STRIP_KEY) === 'open'; } catch (e) {}
          var paintFold = function () {
            strip.classList.toggle('is-folded', !open);
            tg.setAttribute('aria-expanded', open ? 'true' : 'false');
          };
          paintFold();
          tg.addEventListener('click', function () {
            open = !open;
            try { localStorage.setItem(STRIP_KEY, open ? 'open' : 'closed'); } catch (e) {}
            paintFold();
          });
        }
        var stamps = $('wb-stamps');
        if (stamps) stamps.addEventListener('click', function (e) {
          var b = e.target.closest('.wd-stamp');
          if (!b || !window.KA_Vocab) return;
          var card = KA_Vocab.cards()[Number(b.dataset.i)];
          if (card) KA_Vocab.goTo(card);
        });
        // ✓ / ✗ from the keyboard, like the arrows: J = got it, K = still learning
        document.addEventListener('keydown', function (e) {
          if (e.altKey || e.ctrlKey || e.metaKey) return;
          var tag = (e.target && e.target.tagName || '').toLowerCase();
          if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
          if (e.key === 'j' || e.key === 'J') { e.preventDefault(); if (window.KA_Vocab) KA_Vocab.grade(true); }
          if (e.key === 'k' || e.key === 'K') { e.preventDefault(); if (window.KA_Vocab) KA_Vocab.grade(false); }
        });
        // repaint names when the language changes
        window.addEventListener('katsuyo:lang', function () {
          if (currentCard) onCard(currentCard, currentOpts);
          if (railHost && window.KA_Words && window.KA_Vocab) KA_Words.paintRail(railHost, KA_Vocab.deck());
          var s2 = $('wb-sub');
          if (s2 && window.KA_Words) s2.textContent = KA_Words.deckCards('all').length + ' ' + ct('wb_words', 'words') + ' · ' + (KA_Words.DECKS.length - 1) + ' ' + ct('wb_decks', 'decks');
        });
      }

      window.KA_WordsPage = { onCard: onCard, onDeck: onDeck, onGrade: onGrade, onProgress: onProgress, onFlip: function () {} };
      // app.js initialises the deck on DOMContentLoaded; the rail must exist first.
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init, { once: true });
      else init();
    })();
  </script>

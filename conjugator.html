          <option value="zh">🌐 中文</option>

  <div id="page-conjugator" class="page active">
    <div class="conjugator-page">
      <div class="conjugator-header">
        <div>
          <div class="page-tag" data-i18n="page_tag">Interactive Practice</div>
          <h1 class="page-title" style="font-size: 2rem" data-i18n="conj_title">The Conjugator</h1>
        </div>
        <div style="display: flex; align-items: center; gap: 1rem;">
          <button id="report-btn" class="report-btn" onclick="showMistakeReport()" title="View your practice report" data-i18n="view_report">
            📊 View Report
          </button>
          <button type="button" id="reset-stats-btn" class="reset-btn" title="Reset score" onclick="resetScoreNow()" style="padding: 0.75rem 1rem; font-size: 0.85rem;" data-i18n="reset_short">
            ↺ Reset
          </button>
          <div class="score-box">
            <div class="score-label" data-i18n="score">Score</div>
            <div class="score-value"><span id="score-correct">0</span> / <span id="score-total">0</span></div>
          </div>
        </div>
      </div>

      <!-- Filters Row -->
      <div style="display: flex; gap: 0.75rem; margin-bottom: 1.5rem; flex-wrap: wrap;">
        <!-- Form Select -->
        <select id="form-select" class="form-select" onchange="generateNewQuestion()" style="flex: 2; min-width: 200px; margin-bottom: 0;">
          <optgroup label="🎲 Random Modes" data-i18n-label="og_random">
            <option value="random" data-i18n="f_random">Random (All Forms)</option>
            <option value="random-basic" data-i18n="f_random_basic">Random (Basic Only)</option>
            <option value="random-intermediate" data-i18n="f_random_int">Random (Intermediate)</option>
            <option value="random-advanced" data-i18n="f_random_adv">Random (Advanced)</option>
          </optgroup>
          <optgroup label="📚 Basic Forms (N5)" data-i18n-label="og_basic">
            <option value="masu" data-i18n="f_masu">Polite (ます)</option>
            <option value="negative" data-i18n="f_negative">Negative (ない)</option>
            <option value="past" data-i18n="f_past">Past (た)</option>
            <option value="te" data-i18n="f_te">Te-form (て)</option>
            <option value="masen" data-i18n="f_masen">Polite Negative (ません)</option>
            <option value="mashita" data-i18n="f_mashita">Polite Past (ました)</option>
            <option value="nakatta" data-i18n="f_nakatta">Negative Past (なかった)</option>
          </optgroup>
          <optgroup label="🎯 Intermediate Forms (N4)" data-i18n-label="og_intermediate">
            <option value="tai" data-i18n="f_tai">Want to (たい)</option>
            <option value="potential" data-i18n="f_potential">Potential (られる/える)</option>
            <option value="volitional" data-i18n="f_volitional">Volitional (よう/おう)</option>
            <option value="ba" data-i18n="f_ba">Conditional (ば)</option>
            <option value="tara" data-i18n="f_tara">Conditional (たら)</option>
            <option value="imperative" data-i18n="f_imperative">Imperative (命令形)</option>
          </optgroup>
          <optgroup label="🔥 Advanced Forms (N3+)" data-i18n-label="og_advanced">
            <option value="passive" data-i18n="f_passive">Passive (られる/あれる)</option>
            <option value="causative" data-i18n="f_causative">Causative (させる/あせる)</option>
            <option value="causative-passive" data-i18n="f_caus_pass">Causative-Passive (させられる)</option>
          </optgroup>
        </select>

        <!-- JLPT Filter -->
        <select id="jlpt-filter" class="form-select" onchange="generateNewQuestion()" style="flex: 1; min-width: 120px; margin-bottom: 0;">
          <option value="all" data-i18n="jlpt_all">All Levels</option>
          <option value="N5" data-i18n="jlpt_n5">N5 Only</option>
          <option value="N4" data-i18n="jlpt_n4">N4 Only</option>
          <option value="N3" data-i18n="jlpt_n3">N3 Only</option>
          <option value="N5-N4" data-i18n="jlpt_n54">N5 + N4</option>
        </select>
      </div>

      <div class="verb-display">
        <div id="verb-type" class="verb-type">Godan Verb</div>
        <div id="verb-kanji" class="verb-kanji jp">行く</div>
        <div class="verb-info">
          <span id="verb-hiragana" class="jp">いく</span> — <span id="verb-meaning">to go</span>
        </div>
      </div>

      <div class="prompt-row">
        <span class="prompt-text">
          <span id="prompt-form" class="prompt-form">Negative</span>
        </span>
        <button class="hint-btn" onclick="toggleHint()">
          <span id="hint-btn-text" data-i18n="show_hint">💡 Show hint</span>
        </button>
      </div>

      <div id="hint-box" class="hint-box">
        <div class="hint-label" data-i18n="hint_label">💡 Hint</div>
        <div id="hint-content"></div>
      </div>

      <input 
        type="text"
        id="answer-input"
        class="answer-input jp"
        placeholder="ひらがなで入力..."
        onkeypress="handleKeyPress(event)"
      >

      <div id="feedback-warning" class="feedback warning">
        <div class="feedback-title" data-i18n="warn_try_again">⚠️ Not quite — try again!</div>
      </div>

      <div id="feedback-result" class="feedback">
        <div id="feedback-title" class="feedback-title"></div>
        <div class="feedback-answer jp"><span data-i18n="fb_answer">Answer:</span> <strong id="feedback-answer"></strong></div>
        <div id="feedback-explanation" class="feedback-explanation"></div>
        <div id="ai-examples" style="margin-top: 15px; display: none;"></div>
        <button id="more-examples-btn" onclick="showMoreExamples()" style="display: none; margin-top: 10px; background: #4a90a4; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.9rem;" data-i18n="more_examples">
          📚 Show More Examples
        </button>
      </div>

      <button id="check-btn" class="check-btn primary" onclick="checkAnswer()" disabled data-i18n="check">Check Answer</button>
      <button id="skip-btn" class="skip-btn" onclick="skipQuestion()" data-i18n="skip">Skip (show answer)</button>
      <button id="next-btn" class="check-btn next" onclick="generateNewQuestion()" data-i18n="next">Next Question →</button>
    </div>
  </div>

  <!-- DATE DOJO PAGE - Dark Gothic Theme -->
  <!-- MISTAKE REPORT MODAL -->
  <div id="mistake-report-modal" class="report-modal">
    <div class="report-content">
      <div class="report-header">
        <h2 style="font-size: 1.75rem; font-weight: 700; margin: 0;">📊 Your Practice Report</h2>
        <div style="display: flex; gap: 0.5rem; align-items: center;">
          <button class="report-download" onclick="downloadReport()" title="Download report (open and print to save as PDF)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Download
          </button>
          <button class="report-close" onclick="closeMistakeReport()">×</button>
        </div>
      </div>
      <div class="report-body" id="report-body-content">
        <!-- Content will be populated by JavaScript -->
      </div>
    </div>
  </div>


  <!-- Back to Top Button -->
  <button id="back-to-top" class="back-to-top" title="Back to top" aria-label="Back to top">
    ↑
  </button>

  <div id="toast" class="toast"></div>

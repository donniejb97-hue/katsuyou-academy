<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Analytics: Clarity + Google, both configured in analytics.js -->
  <script src="analytics.js"></script>
  <title>Kanji Kitchen — KLC Kanji Practice | Katsuyō Academy</title>
  <meta name="description" content="Quiz yourself on 2,300 KLC kanji. Type keywords, pick the right character, and learn readings and vocabulary as you go.">
  <link rel="canonical" href="https://katsuyoacademy.com/kanji-drill">
  <link rel="icon" type="image/png" href="open_book.png">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="wok-theme.css">
  <style>
    .drill-page { max-width: 800px; margin: 0 auto; padding: 2rem; }
    .drill-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .drill-scores { display: flex; gap: 0.75rem; align-items: stretch; }
    .drill-score-box { background: var(--ink); color: var(--paper); border-radius: 8px; padding: 0.6rem 1.1rem; text-align: center; min-width: 84px; }
    .drill-score-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.7; }
    .drill-score-value { font-size: 1.25rem; font-weight: 700; }
    .drill-score-box.streak .drill-score-value { color: var(--gold); }

    .drill-controls { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.5rem; }
    .drill-control-row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
    .drill-control-label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-light); min-width: 60px; }
    .drill-chip { border: 1.5px solid rgba(0,0,0,0.15); background: white; color: var(--text); padding: 0.45rem 1rem; border-radius: 999px; font-family: inherit; font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: all 0.15s; }
    .drill-chip:hover { border-color: var(--accent-soft); }
    .drill-chip.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }
    .drill-chip.on.set-chip { background: var(--sage); border-color: var(--sage); }

    .drill-card { background: white; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 2.5rem 2rem; text-align: center; margin-bottom: 1.25rem; position: relative; }
    .drill-question-tag { display: inline-block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); background: rgba(196,92,74,0.1); padding: 0.3rem 0.9rem; border-radius: 999px; margin-bottom: 1rem; }
    .drill-question { font-size: 5.5rem; line-height: 1.1; color: var(--ink); min-height: 6rem; }
    .drill-question.keyword-q { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 2.2rem; letter-spacing: 0.06em; min-height: 6rem; display: flex; align-items: center; justify-content: center; }
    .drill-klc-id { position: absolute; top: 1rem; right: 1.25rem; font-size: 0.75rem; color: var(--text-light); letter-spacing: 0.05em; }

    .drill-choices { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.75rem; margin-bottom: 1.25rem; }
    .drill-choice { background: white; border: 2px solid rgba(0,0,0,0.12); border-radius: 10px; padding: 0.75rem 0.5rem; font-size: 3rem; cursor: pointer; transition: all 0.15s; color: var(--ink); }
    .drill-choice:hover:not(:disabled) { border-color: var(--accent-soft); transform: translateY(-2px); }
    .drill-choice:disabled { cursor: default; }
    .drill-choice.correct { background: rgba(122,158,126,0.18); border-color: var(--sage); }
    .drill-choice.wrong { background: rgba(196,92,74,0.12); border-color: var(--accent); }
    .drill-choice.dim { opacity: 0.45; }

    .drill-answer-row { display: flex; gap: 0.75rem; margin-bottom: 1.25rem; }
    .drill-input { flex: 1; padding: 1rem 1.25rem; font-size: 1.3rem; border: 2px solid rgba(0,0,0,0.15); border-radius: 10px; font-family: 'Outfit', sans-serif; outline: none; text-align: center; letter-spacing: 0.04em; }
    .drill-input:focus { border-color: var(--accent); }
    .drill-input:disabled { background: var(--paper-warm); }
    .drill-input.correct { border-color: var(--sage); background: rgba(122,158,126,0.1); }
    .drill-input.wrong { border-color: var(--accent); background: rgba(196,92,74,0.08); }
    .drill-input.almost { border-color: #f9a825; animation: drill-shake 0.35s; }
    @keyframes drill-shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .drill-input.almost { animation: none; }
    }

    .drill-feedback { border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; display: none; text-align: center; }
    .drill-feedback.show { display: block; }
    .drill-feedback.good { background: rgba(122,158,126,0.15); border: 1px solid var(--sage); color: #3f5c42; }
    .drill-feedback.bad { background: rgba(196,92,74,0.1); border: 1px solid var(--accent-soft); color: #8a3d2f; }
    .drill-feedback.warn { background: rgba(249,168,37,0.14); border: 1px solid #f9a825; color: #7a5a10; font-weight: 500; }
    .drill-feedback .big { font-size: 1.35rem; margin-top: 0.25rem; }
    .drill-feedback .big .jp { font-size: 2rem; vertical-align: middle; margin-right: 0.35rem; }

    .drill-detail { margin-top: 0.85rem; padding-top: 0.85rem; border-top: 1px dashed rgba(0,0,0,0.15); font-size: 0.95rem; display: flex; flex-direction: column; gap: 0.3rem; color: inherit; }
    .drill-detail .row { display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap; }
    .drill-detail .lbl { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; opacity: 0.65; align-self: center; }
    .drill-detail ruby rt { font-size: 0.55em; opacity: 0.8; }

    .drill-actions { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    .drill-btn { flex: 1; padding: 1rem; font-family: inherit; font-size: 1rem; font-weight: 600; border-radius: 10px; border: none; cursor: pointer; transition: all 0.15s; min-width: 140px; }
    .drill-btn.primary { background: var(--accent); color: white; }
    .drill-btn.primary:hover:not(:disabled) { background: var(--accent-soft); }
    .drill-btn.primary:disabled { opacity: 0.45; cursor: default; }
    .drill-btn.ghost { background: white; border: 1.5px solid rgba(0,0,0,0.15); color: var(--text); }
    .drill-btn.ghost:hover { border-color: var(--accent-soft); }

    .drill-missed { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); padding: 1.5rem 2rem; margin-top: 2rem; display: none; }
    .drill-missed.show { display: block; }
    .drill-missed h2 { font-size: 1.1rem; color: var(--ink); margin-bottom: 0.75rem; }
    .drill-missed-list { display: flex; flex-wrap: wrap; gap: 0.6rem; }
    .drill-missed-chip { background: var(--paper-warm); border: 1px solid rgba(0,0,0,0.1); border-radius: 8px; padding: 0.4rem 0.8rem; font-size: 0.9rem; cursor: default; }
    .drill-missed-chip .jp { font-size: 1.5rem; margin-right: 0.45rem; vertical-align: middle; }
    .drill-missed-chip small { color: var(--text-light); }

    @media (max-width: 540px) {
      .drill-page { padding: 1.25rem; }
      .drill-question { font-size: 4rem; }
      .drill-question.keyword-q { font-size: 1.6rem; }
      .drill-choices { grid-template-columns: repeat(2, 1fr); }
    }
  
    /* ---- handed a list by the wall ---- */
    .kd-round[hidden], .kd-done[hidden] { display: none; }
    .kd-strip { display: grid; gap: 3px; grid-auto-flow: column; grid-auto-columns: 1fr; }
    .kd-pip { height: 9px; border-radius: 3px; background: #e3d8c6; }
    .kd-pip.is-right { background: #4f7454; }
    .kd-pip.is-wrong { background: #c45c4a; }
    .kd-pip.is-now   { background: #2b2320; }

    .kd-done { background: #2b2320; border-radius: 16px; padding: 1.3rem 1.5rem; margin: 1rem 0;
      color: #fdfbf7; }
    .kd-done h3 { margin: 0 0 0.3rem; font-size: 1.35rem; font-weight: 700; color: #fdfbf7; }
    .kd-done p { margin: 0 0 0.9rem; font-size: 0.88rem; color: rgba(253,251,247,0.7); line-height: 1.6; }
    .kd-done-tiles { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1rem; }
    .kd-tile { font-family: 'Noto Serif JP', serif; font-size: 1.3rem; border-radius: 8px;
      padding: 0.35rem 0.6rem; }
    .kd-tile.t-solid { background: rgba(255,255,255,0.14); color: #fdfbf7; }
    .kd-tile.t-shaky { background: #e8b4a8; color: #2b2320; }
    .kd-done-acts { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .kd-done-acts a, .kd-done-acts button { padding: 0.7rem 1.3rem; border-radius: 999px;
      font-family: inherit; font-size: 0.86rem; font-weight: 600; cursor: pointer;
      text-decoration: none; border: 0; }
    .kd-go { background: #c45c4a; color: #fff; }
    .kd-ghost { background: rgba(255,255,255,0.1); color: #fdfbf7; }

    /* the primary action was a washed-out pink that read as disabled */
    .drill-btn.primary:not(:disabled) { background: #c45c4a; color: #fff;
      box-shadow: 0 2px 9px rgba(196,92,74,0.28); }

  
    .kd-navrow { display: flex; align-items: center; gap: 0.9rem; margin-bottom: 0.9rem;
      flex-wrap: wrap; }
    .kd-navrow-note { font-size: 0.76rem; color: #8a7f76; }
    .kd-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .drill-select { padding: 0.5rem 0.85rem; border-radius: 999px; border: 1px solid rgba(0,0,0,0.14);
      background: #fff; font-family: inherit; font-size: 0.84rem; color: #2b2320; cursor: pointer; }
    .kd-custom { display: inline-flex; align-items: center; gap: 0.35rem; }
    .kd-custom[hidden] { display: none; }
    .kd-num { width: 5rem; padding: 0.45rem 0.6rem; border-radius: 999px;
      border: 1px solid rgba(0,0,0,0.14); background: #fff; font-family: inherit;
      font-size: 0.84rem; color: #2b2320; }
    .kd-dash { color: #8a7f76; }
    .kd-poolsize { font-size: 0.76rem; color: #8a7f76; margin-left: auto; }

    /* ============================================================
       THE WOK — the drill lives in the same world as the wall.
       Paper ground, the same header art (shorter), paper-and-ink controls,
       and stamps everywhere a kanji's state is shown: the round strip, the
       end-of-round panel, the missed list.
       ============================================================ */
    #page-kanji-drill { background: var(--wok-paper); color: var(--wok-ink); }
    /* One baseline: the ← button, the seal and the title all sit on the same
       line, with the eyebrow above the title only. Everything is sized off
       the title so the row reads as one object rather than three. */
    .kd-hero { padding: 2rem 0 1.5rem; min-height: 200px; margin-bottom: 0.4rem;
      display: flex; flex-direction: column; }
    .kd-hero-inner { max-width: 800px; width: 100%; margin: auto auto 0; padding: 0 2rem; box-sizing: border-box;
      display: flex; align-items: flex-end; gap: 1rem; }
    .kd-hero .wok-title-row { align-items: flex-end; gap: 1rem; }
    .kd-hero .wok-seal { width: 62px; height: 62px; font-size: 2.3rem; }
    .kd-hero .page-tag { color: var(--wok-red); margin: 0 0 0.3rem; font-size: 0.7rem; letter-spacing: 0.2em; font-weight: 800; }
    .kd-hero .page-title { color: var(--wok-ink); margin: 0; font-size: 2.6rem !important; line-height: 1; }
    .kd-hero .wok-branch { height: 72%; }
    .kd-back { flex: none; width: 42px; height: 42px; margin-bottom: 0.5rem; border-radius: 50%; border: 1.5px solid var(--wok-ink);
      background: #fff; color: var(--wok-ink); display: inline-flex; align-items: center; justify-content: center;
      font-size: 1.15rem; font-weight: 700; text-decoration: none; line-height: 1; }
    .kd-back:hover { text-decoration: none; transform: translate(-1px,-1px); box-shadow: var(--wok-shadow); }
    .drill-page { padding-top: 0.5rem; }

    /* toolbar */
    .kd-toolbar { display: flex; flex-direction: row; align-items: center; gap: 0.6rem; flex-wrap: wrap;
      background: #fff; border: 2px solid var(--wok-ink); border-radius: 14px; box-shadow: 4px 4px 0 var(--wok-ink);
      padding: 0.6rem 0.75rem; margin-bottom: 0.9rem; }
    .kd-seg { display: inline-flex; border: 1.5px solid var(--wok-ink); border-radius: 999px; overflow: hidden; background: #fff; }
    .kd-seg-btn { border: 0; background: none; padding: 0.45rem 0.85rem; font-family: inherit; font-size: 0.8rem;
      font-weight: 700; color: var(--wok-ink); cursor: pointer; white-space: nowrap; }
    .kd-seg-btn + .kd-seg-btn { border-left: 1.5px solid var(--wok-ink); }
    .kd-seg-btn.on { background: var(--wok-ink); color: var(--wok-paper); }
    .kd-seg-btn:disabled { color: var(--wok-faint); cursor: default; }
    .kd-seg-btn.on:disabled { background: var(--wok-mute); color: var(--wok-paper); }
    .kd-toolbar-right { margin-left: auto; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .kd-round-tag { display: inline-flex; align-items: center; padding: 0.45rem 0.85rem; border-radius: 999px;
      border: 1.5px solid var(--wok-red); background: var(--wok-red-wash); color: var(--wok-red);
      font-size: 0.8rem; font-weight: 700; font-family: 'Outfit', 'Noto Serif JP', sans-serif; }
    .kd-round-tag[hidden] { display: none; }
    .kd-poolsize { margin-left: 0; }

    /* status bar */
    .kd-status { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
      background: #fff; border: 2px solid var(--wok-ink); border-radius: 14px; box-shadow: 4px 4px 0 var(--wok-ink);
      padding: 0.55rem 0.9rem; margin-bottom: 1.1rem; }
    .kd-status .drill-scores { display: flex; gap: 1rem; align-items: baseline; }
    .kd-score { font-size: 0.82rem; font-weight: 700; color: var(--wok-ink); }
    .kd-score .drill-score-label { font-size: 0.82rem; text-transform: none; letter-spacing: 0; opacity: 1; color: inherit; font-weight: 700; }
    .kd-score.is-red { color: var(--wok-red); }
    .kd-score b { font-weight: 800; }
    .kd-reset { margin-left: auto; border: 0; background: none; font-family: inherit; font-size: 0.78rem;
      font-weight: 700; color: var(--wok-red-dark); text-decoration: underline; cursor: pointer; padding: 0.2rem 0; }
    .kd-round { display: flex; align-items: center; gap: 0.6rem; margin-left: auto; }
    .kd-round[hidden] { display: none; }
    .kd-status.is-round .kd-reset { margin-left: 0; }
    .kd-status.is-round #kd-best-wrap { display: none; }
    .kd-round-count { font-size: 0.76rem; color: var(--wok-mute); white-space: nowrap; }
    .drill-control-label { color: var(--wok-mute); }
    .drill-chip { border: 1.5px solid var(--wok-ink); color: var(--wok-ink); font-weight: 700; }
    .drill-chip:hover { border-color: var(--wok-ink); transform: translate(-1px,-1px); box-shadow: var(--wok-shadow); }
    .drill-chip.on { background: var(--wok-ink); border-color: var(--wok-ink); color: var(--wok-paper); }
    .drill-select, .kd-num { border: 1.5px solid var(--wok-ink); color: var(--wok-ink); font-weight: 600; }
    .drill-select { max-width: 11.5rem; text-overflow: ellipsis; }

    .kd-strip { display: flex; flex-wrap: wrap; gap: 5px; }
    .kd-pip { width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--wok-line);
      background: var(--wok-paper-2); box-sizing: border-box; display: flex; align-items: center;
      justify-content: center; font-size: 0.62rem; font-weight: 800; font-family: 'Outfit', sans-serif; }
    .kd-pip.is-right { background: var(--stamp, var(--wok-ink)); border-color: transparent; color: var(--stamp-fg, #fff);
      box-shadow: 1.5px 1.5px 0 var(--wok-ink); transform: rotate(var(--tilt, -3deg)); }
    .kd-pip.is-wrong { background: #fff; border: 2px solid var(--wok-red); color: var(--wok-red); }
    .kd-pip.is-now   { background: var(--wok-ink); border-color: var(--wok-ink); color: var(--wok-paper); }

    .drill-card { border: 2px solid var(--wok-ink); border-radius: 22px; box-shadow: var(--wok-shadow-lg); }
    .kd-hear { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.4rem 0.8rem; border-radius: 999px;
      border: 1.5px solid var(--wok-ink); background: #fff; color: var(--wok-ink); font-family: inherit;
      font-size: 0.76rem; font-weight: 700; cursor: pointer; line-height: 1; }
    .kd-hear svg { width: 15px; height: 15px; }
    .kd-hear:hover { transform: translate(-1px,-1px); box-shadow: var(--wok-shadow); }
    .kd-hear.playing { background: var(--wok-ink); color: var(--wok-paper); }
    .kd-hear[hidden] { display: none; }
    .kd-hear-card { position: absolute; top: 0.9rem; left: 1.1rem; }
    .kd-hear.is-mini { padding: 0.2rem; width: 22px; height: 22px; justify-content: center; margin-right: 0.3rem;
      vertical-align: middle; border-color: var(--wok-line); color: var(--wok-mute); }
    .kd-hear.is-mini svg { width: 12px; height: 12px; }
    .kd-hear.is-mini:hover, .kd-hear.is-mini.playing { border-color: var(--wok-ink); color: var(--wok-ink); box-shadow: none; transform: none; }
    .kd-hear.is-mini.playing { background: var(--wok-ink); color: var(--wok-paper); }
    .drill-feedback .kd-hear { vertical-align: middle; }
    @media (max-width: 540px) { .kd-hear-card { position: static; margin-bottom: 0.6rem; } }
    .drill-question-tag { color: var(--wok-red); background: var(--wok-red-wash); font-weight: 800; }
    .drill-question { color: var(--wok-ink); }
    .drill-klc-id { color: var(--wok-red); font-weight: 800; letter-spacing: 0.1em; }

    .drill-choice { border: 2px solid var(--wok-ink); border-radius: 14px; box-shadow: 3px 3px 0 var(--wok-ink); }
    .drill-choice:hover:not(:disabled) { border-color: var(--wok-ink); transform: translate(-1px,-1px); }
    .drill-choice.correct { background: var(--stamp, var(--wok-ink)); border-color: transparent; color: var(--stamp-fg, #fff);
      transform: rotate(-2deg); }
    .drill-choice.wrong { background: #fff; border-color: var(--wok-red); color: var(--wok-red); box-shadow: none; }
    .drill-choice.dim { opacity: 0.35; box-shadow: none; }
    .drill-choices.is-text { grid-template-columns: repeat(2, 1fr); }
    .drill-choice.is-text { font-family: 'Outfit', sans-serif; font-size: 1.05rem; font-weight: 700; padding: 1rem 0.9rem;
      letter-spacing: 0.02em; text-transform: lowercase; }

    .drill-input { border: 2px solid var(--wok-ink); border-radius: 14px; box-shadow: 3px 3px 0 var(--wok-ink); }
    .drill-input:focus { border-color: var(--wok-ink); }
    .drill-input.correct { border-color: var(--wok-ink); background: #edf5ee; }
    .drill-input.wrong { border-color: var(--wok-red); background: #fff; color: var(--wok-red); }

    .drill-feedback { border-radius: 14px; border: 2px solid; }
    .drill-feedback.good { background: #fff; border-color: var(--stamp, var(--wok-ink)); color: var(--wok-ink); }
    .drill-feedback.bad { background: #fff; border-color: var(--wok-red); color: var(--wok-ink); }
    .drill-feedback.warn { background: #fff; border-color: #e0a030; color: var(--wok-ink); }
    .drill-detail { border-top: 1px solid var(--wok-line); }

    .drill-btn { border-radius: 999px; border: 1.5px solid var(--wok-ink); font-weight: 700; }
    .drill-btn.primary:not(:disabled) { background: var(--wok-red); border-color: var(--wok-red); color: #fff; box-shadow: none; }
    .drill-btn.primary:hover:not(:disabled) { background: var(--wok-red); transform: translate(-1px,-1px); box-shadow: var(--wok-shadow); }
    .drill-btn.primary:disabled { background: #fff; color: var(--wok-ink); }
    .drill-btn.ghost { background: #fff; border: 1.5px solid var(--wok-ink); color: var(--wok-ink); }
    .drill-btn.ghost:hover { border-color: var(--wok-ink); transform: translate(-1px,-1px); box-shadow: var(--wok-shadow); }

    .kd-done { background: #fff; color: var(--wok-ink); border: 2px solid var(--wok-ink); border-radius: 22px;
      box-shadow: var(--wok-shadow-lg); }
    .kd-done h3 { color: var(--wok-ink); font-size: 1.6rem; }
    .kd-done p { color: var(--wok-mute); }
    .kd-done-tiles { gap: 0.6rem; }
    .kd-tile { width: 52px; height: 52px; padding: 0; font-size: 1.5rem; border-radius: 10px; display: flex;
      align-items: center; justify-content: center; position: relative; box-sizing: border-box; }
    .kd-tile.t-solid { background: var(--stamp, var(--wok-ink)); color: var(--stamp-fg, #fff); box-shadow: var(--wok-shadow);
      transform: rotate(var(--tilt, -2deg)); }
    .kd-tile.t-shaky { background: #fff; color: var(--wok-red); border: 2px solid var(--wok-red); box-shadow: var(--wok-shadow); }

  <script>
  // ==========================================================================
  // KANJI DRILL — quiz engine over kanjiDataList (loaded by kanji-data.js)
  // ==========================================================================
  (function () {
    'use strict';

    var state = {
      answer: 'type',            // 'type' | 'pick' — how you answer in Kanji → Keyword
      mode: 'kanji2keyword',
      lo: 1, hi: 500,        // the drill range, now any span rather than 3 fixed sets
      onlyWrong: false,      // "only the ones I've got wrong", read from the shared store
      correct: 0, total: 0, streak: 0, best: 0,
      current: null,
      answered: false,
      retried: false,
      missed: {},         // key: kanji char → item

      // Set only when the wall handed this page a list. When it is null the
      // drill behaves exactly as it always did: endless, range-driven.
      queue: null,        // [klc id, …] in the order the wall shuffled them
      qLabel: '',
      qIdx: 0,
      qResult: []         // true / false per answered question, for the strip
    };

    var RANGES = { r1: [1, 500], r2: [501, 1200], r3: [1201, 2300] };

    try {
      var saved = localStorage.getItem('kanjiDrillBest');
      if (saved) state.best = parseInt(saved, 10) || 0;
    } catch (e) { /* storage unavailable — fine */ }

    function $(id) { return document.getElementById(id); }

    function dataReady() {
      return typeof kanjiDataList !== 'undefined' && kanjiDataList.length > 0;
    }

    function pool() {
      var out = [];
      if (state.onlyWrong && window.KA_Kanji) {
        // Exactly what the wall's "Drill the shaky" does, without the wall.
        KA_Kanji.idsWithStatus(1, 2300, 'shaky').forEach(function (id) {
          var k = byKlcId(id);
          if (k) out.push(k);
        });
        return out;
      }
      for (var i = 0; i < kanjiDataList.length; i++) {
        var k = kanjiDataList[i];
        if (k.id >= state.lo && k.id <= state.hi) out.push(k);
      }
      return out;
    }

    // "SUN ・ DAY ・ JAPAN" → ['sun', 'day', 'japan']
    function keywordParts(item) {
      return item.keyword.split('・').map(function (p) {
        return p.trim().toLowerCase();
      }).filter(Boolean);
    }

    function primaryKeyword(item) {
      return item.keyword.split('・')[0].trim();
    }

    // 日[ひ]にち → ruby markup
    function toRuby(word) {
      return word.replace(/([^\s\[\]]+)\[([^\]]+)\]/g, '<ruby>$1<rt>$2</rt></ruby>');
    }

    // ---------- "almost there" detection ----------
    function levenshtein(a, b) {
      if (a === b) return 0;
      var m = a.length, n = b.length;
      if (!m) return n;
      if (!n) return m;
      var row = [];
      for (var j = 0; j <= n; j++) row[j] = j;
      for (var i = 1; i <= m; i++) {
        var prev = row[0];
        row[0] = i;
        for (var k = 1; k <= n; k++) {
          var tmp = row[k];
          row[k] = Math.min(
            row[k] + 1,
            row[k - 1] + 1,
            prev + (a.charAt(i - 1) === b.charAt(k - 1) ? 0 : 1)
          );
          prev = tmp;
        }
      }
      return row[n];
    }

    // One letter off for short keywords, up to two for long ones.
    function isClose(val, item) {
      var parts = keywordParts(item);
      for (var i = 0; i < parts.length; i++) {
        var p = parts[i];
        var maxDist = p.length >= 7 ? 2 : 1;
        if (p.length >= 3 && levenshtein(val, p) <= maxDist) return true;
      }
      return false;
    }

    // ---------- question generation ----------
    function newQuestion() {
      if (!dataReady()) return;
      var item;
      // Distractors come from the drill's own pool, or — in a round handed
      // over by the wall, which has no range — from the round's block.
      var p;
      if (state.queue) {
        // A handed-over round is finite and in a fixed order, so the strip at
        // the top means something and the round actually ends.
        if (state.qIdx >= state.queue.length) { finishRound(); return; }
        item = byKlcId(state.queue[state.qIdx]);
        if (!item) { state.qIdx++; newQuestion(); return; }
        paintStrip();
        var blo = Math.floor((item.id - 1) / 100) * 100 + 1;
        p = kanjiDataList.filter(function (k) { return k.id >= blo && k.id < blo + 100; });
        if (p.length < 4) p = kanjiDataList;
      } else {
        p = pool();
        if (!p.length) { showPoolSize(); return; }
        item = p[Math.floor(Math.random() * p.length)];
        if (state.current && p.length > 3) {
          while (item.kanji === state.current.item.kanji) {
            item = p[Math.floor(Math.random() * p.length)];
          }
        }
      }
      state.current = { item: item };
      state.answered = false;
      state.retried = false;
      if (window.KA_Listen) KA_Listen.stop();     // never talk over the next question
      paintHear();

      $('drill-klc-id').textContent = 'KLC #' + item.id;

      var fb = $('drill-feedback');
      fb.className = 'drill-feedback';
      fb.innerHTML = '';

      if (state.mode === 'kanji2keyword' && state.answer === 'pick') {
        $('drill-tag').textContent = 'What is the keyword?';
        var qp = $('drill-question');
        qp.className = 'drill-question jp';
        qp.textContent = item.kanji;
        $('drill-type-row').style.display = 'none';
        $('drill-choices').style.display = 'grid';
        buildChoices(item, p, true);
        $('drill-check').style.display = 'none';
        $('drill-skip').style.display = 'block';
      } else if (state.mode === 'kanji2keyword') {
        $('drill-tag').textContent = 'What is the keyword?';
        var q = $('drill-question');
        q.className = 'drill-question jp';
        q.textContent = item.kanji;
        $('drill-type-row').style.display = 'flex';
        $('drill-choices').style.display = 'none';
        var input = $('drill-input');
        input.value = '';
        input.disabled = false;
        input.className = 'drill-input';
        input.focus();
        $('drill-check').style.display = 'block';
        $('drill-check').disabled = true;
        $('drill-check').setAttribute('data-i18n', 'check');
        $('drill-check').textContent = tt('check', 'Check Answer');
        $('drill-skip').style.display = 'block';
      } else {
        $('drill-tag').textContent = 'Pick the kanji';
        var q2 = $('drill-question');
        q2.className = 'drill-question keyword-q';
        q2.textContent = item.keyword;
        $('drill-type-row').style.display = 'none';
        $('drill-choices').style.display = 'grid';
        buildChoices(item, p, false);
        $('drill-check').style.display = 'none';
        $('drill-skip').style.display = 'block';
      }
    }

    function buildChoices(answer, p, asText) {
      var distractors = [];
      var usedKanji = {};
      usedKanji[answer.kanji] = true;
      var usedKeyword = {};
      usedKeyword[primaryKeyword(answer).toLowerCase()] = true;
      var guard = 0;
      while (distractors.length < 3 && guard < 300) {
        guard++;
        var cand = p[Math.floor(Math.random() * p.length)];
        var pk = primaryKeyword(cand).toLowerCase();
        if (usedKanji[cand.kanji] || usedKeyword[pk]) continue;
        usedKanji[cand.kanji] = true;
        usedKeyword[pk] = true;
        distractors.push(cand);
      }
      var options = distractors.concat([answer]);
      for (var i = options.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = options[i]; options[i] = options[j]; options[j] = t;
      }
      var box = $('drill-choices');
      box.innerHTML = '';
      box.classList.toggle('is-text', !!asText);
      options.forEach(function (opt) {
        var b = document.createElement('button');
        b.className = asText ? 'drill-choice is-text' : 'drill-choice jp';
        b.textContent = asText ? primaryKeyword(opt).toLowerCase() : opt.kanji;
        b.dataset.kanji = opt.kanji;
        b.style.setProperty('--stamp', KA_Kanji.colour(opt.id));
        b.onclick = function () { chooseKanji(opt, b); };
        box.appendChild(b);
      });
    }

    // ---------- answering ----------
    function chooseKanji(opt, btn) {
      if (state.answered) return;
      state.answered = true;
      var item = state.current.item;
      var right = opt.kanji === item.kanji;
      var buttons = $('drill-choices').querySelectorAll('.drill-choice');
      buttons.forEach(function (b) {
        b.disabled = true;
        if (b.dataset.kanji === item.kanji) b.classList.add('correct');
        else if (b === btn) b.classList.add('wrong');
        else b.classList.add('dim');
      });
      record(right);
      // Colour reflects the streak this answer just produced.
      buttons.forEach(function (b) {
        if (b.dataset.kanji === item.kanji) {
          b.style.setProperty('--stamp', KA_Kanji.colour(item.id));
          b.style.setProperty('--stamp-fg', KA_Kanji.textOn(item.id));
        }
      });
      showFeedback(right);
    }

    function checkDrillAnswer() {
      if (state.answered || state.mode !== 'kanji2keyword') return;
      var input = $('drill-input');
      var val = input.value.trim().toLowerCase().replace(/\s+/g, ' ').replace(/\.$/, '');
      if (!val) return;
      var item = state.current.item;
      var right = keywordParts(item).indexOf(val) !== -1;

      // Almost there? One more shot before revealing.
      if (!right && !state.retried && isClose(val, item)) {
        state.retried = true;
        input.classList.remove('almost');
        void input.offsetWidth; // restart the shake animation
        input.classList.add('almost');
        var fb = $('drill-feedback');
        fb.className = 'drill-feedback show warn';
        fb.innerHTML = '⚠️ So close — check your spelling and try once more!';
        input.select();
        input.focus();
        return;
      }

      state.answered = true;
      input.disabled = true;
      input.classList.remove('almost');
      input.classList.add(right ? 'correct' : 'wrong');
      record(right);
      showFeedback(right);
    }

    function skipDrill() {
      if (state.answered) return;
      state.answered = true;
      var item = state.current.item;
      if (state.mode === 'kanji2keyword') {
        $('drill-input').disabled = true;
      } else {
        var buttons = $('drill-choices').querySelectorAll('.drill-choice');
        buttons.forEach(function (b) {
          b.disabled = true;
          if (b.dataset.kanji === item.kanji) b.classList.add('correct');
          else b.classList.add('dim');
        });
      }
      record(false);
      showFeedback(false, true);
    }

    function record(right) {
      state.total++;

      // The one line that makes the wall mean anything: every answer here
      // moves that character's tile over there.
      if (state.current && state.current.item && window.KA_Kanji) {
        KA_Kanji.note(state.current.item.id, right);
      }
      if (state.queue) {
        state.qResult[state.qIdx] = right;
        state.qIdx++;
        paintStrip();
      }

      if (right) {
        state.correct++;
        state.streak++;
        if (state.streak > state.best) {
          state.best = state.streak;
          try { localStorage.setItem('kanjiDrillBest', String(state.best)); } catch (e) {}
        }
      } else {
        state.streak = 0;
        var item = state.current.item;
        state.missed[item.kanji] = item;
        renderMissed();
      }
      renderScores();
    }

    function showFeedback(right, skipped) {
      var item = state.current.item;
      var fb = $('drill-feedback');
      fb.className = 'drill-feedback show ' + (right ? 'good' : 'bad');
      fb.style.setProperty('--stamp', KA_Kanji.colour(item.id));
      var head = right ? '⭕ Correct!' : (skipped ? 'Answer:' : '❌ Not quite — the answer is:');

      var on = (item.onyomi && item.onyomi.length) ? item.onyomi.join(' ・ ') : '—';
      var kun = item.kunyomi ? item.kunyomi : '—';
      var vocabHtml = '';
      var ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"></path><path d="M16 9a4 4 0 0 1 0 6"></path></svg>';
      if (item.vocabulary && item.vocabulary.length) {
        var v = item.vocabulary[0];
        vocabHtml = '<div class="row"><span class="lbl">VOCAB</span>' +
          '<button type="button" class="kd-hear is-mini" data-hear="vocab" aria-label="Listen">' + ICON + '</button>' +
          '<span class="jp">' + toRuby(v.word) + '</span><span>' + v.meaning + '</span></div>';
      }

      fb.innerHTML =
        '<div>' + head + '</div>' +
        '<div class="big"><span class="jp">' + item.kanji + '</span><strong>' + item.keyword + '</strong></div>' +
        '<div class="drill-detail">' +
          '<div class="row"><span class="lbl">ON</span><span class="jp">' + on + '</span>' +
          '<span class="lbl">KUN</span><span class="jp">' + kun + '</span>' +
          '<button type="button" class="kd-hear" data-hear="readings">' + ICON + tt('kw_hear', 'Hear the readings') + '</button></div>' +
          vocabHtml +
        '</div>';
      wireHear(fb, item);

      var check = $('drill-check');
      check.style.display = 'block';
      check.disabled = false;
      // i18n's observer re-applies data-i18n after any DOM change, so the label
      // has to be switched by key or it snaps back to "Check Answer".
      check.setAttribute('data-i18n', 'next');
      check.textContent = tt('next', 'Next Question →');
      check.focus();
      $('drill-skip').style.display = 'none';
    }

    function renderScores() {
      $('drill-correct').textContent = state.correct;
      $('drill-total').textContent = state.total;
      $('drill-streak').textContent = state.streak;
      $('drill-best').textContent = state.best;
    }

    function renderMissed() {
      var keys = Object.keys(state.missed);
      var box = $('drill-missed');
      if (!keys.length) { box.className = 'drill-missed'; return; }
      box.className = 'drill-missed show';
      var list = $('drill-missed-list');
      list.innerHTML = '';
      keys.forEach(function (ch) {
        var item = state.missed[ch];
        var chip = document.createElement('span');
        chip.className = 'drill-missed-chip';
        chip.title = 'ON: ' + ((item.onyomi || []).join('・') || '—') + '  KUN: ' + (item.kunyomi || '—');
        chip.innerHTML = '<span class="jp">' + item.kanji + '</span><small>' + item.keyword + ' · #' + item.id + '</small>';
        list.appendChild(chip);
      });
    }


    /* ---------- the handed-over round ---------- */

    function byKlcId(id) {
      var k = kanjiDataList[id - 1];
      if (k && k.id === id) return k;                 // the list is id-ordered
      for (var i = 0; i < kanjiDataList.length; i++) {
        if (kanjiDataList[i].id === id) return kanjiDataList[i];
      }
      return null;
    }

    // The wall already chose the kanji, so the range picker gives way to a
    // tag naming the round; the mode and answer toggles stay usable.
    function enterRound() {
      $('kd-round').hidden = false;
      $('kd-round-label').hidden = false;
      $('kd-round-label').textContent = state.qLabel;
      $('kd-status').classList.add('is-round');
      ['drill-range', 'kd-custom'].forEach(function (id) { $(id).hidden = true; });
    }

    function paintStrip() {
      if (!state.queue) return;
      var strip = $('kd-strip');
      strip.innerHTML = '';
      for (var i = 0; i < state.queue.length; i++) {
        var pip = document.createElement('span');
        pip.className = 'kd-pip' +
          (i < state.qIdx ? (state.qResult[i] ? ' is-right' : ' is-wrong')
                          : (i === state.qIdx ? ' is-now' : ''));
        // A right answer stamps its pip in that kanji's own colour — the same
        // one it wears on the wall — so the strip is a preview of the wall.
        pip.style.setProperty('--stamp', KA_Kanji.colour(state.queue[i]));
        pip.style.setProperty('--stamp-fg', KA_Kanji.textOn(state.queue[i]));
        pip.style.setProperty('--tilt', KA_Kanji.tilt(state.queue[i]) + 'deg');
        if (i < state.qIdx) pip.textContent = state.qResult[i] ? '\u2713' : '\u00d7';
        strip.appendChild(pip);
      }
      var right = state.qResult.filter(Boolean).length;
      $('kd-round-count').textContent =
        Math.min(state.qIdx + 1, state.queue.length) + ' / ' + state.queue.length +
        '  ·  ' + right + ' ' + tt('kd_right', 'right');
    }

    // ---------- listen ----------
    // Same voice path as the wall and Talk (Azure, then the browser). The
    // readings are read out, never the bare kanji; a word is read from its
    // furigana. Buttons hide themselves until something can speak.
    function canHear() { return !!(window.KA_Listen && KA_Listen.available()); }
    function wireHear(root, item) {
      if (!window.KA_Listen) return;
      root.querySelectorAll('.kd-hear').forEach(function (btn) {
        var which = btn.getAttribute('data-hear');
        KA_Listen.attach(btn, function () {
          if (which === 'readings') return window.kanjiReadingSpeech ? window.kanjiReadingSpeech(item) : '';
          var v = (item.vocabulary || [])[0];
          return v ? v.word : '';
        });
        btn.hidden = !canHear();
      });
    }
    function paintHear() {
      var can = canHear();
      document.querySelectorAll('.drill-feedback .kd-hear').forEach(function (b) { b.hidden = !can; });
      var card = $('drill-hear');
      if (card) card.hidden = !(can && state.mode === 'kanji2keyword' && state.current);
    }

    function tt(key, fallback) {
      return (typeof window.t === 'function' && window.t(key) !== key) ? window.t(key) : fallback;
    }

    function finishRound() {
      var ids = state.queue, right = state.qResult.filter(Boolean).length;
      var nowSolid = [], stillShaky = [];
      ids.forEach(function (id) {
        var item = byKlcId(id);
        if (!item) return;
        (KA_Kanji.status(id) === 'solid' ? nowSolid : stillShaky).push(item);
      });

      // Where the block now stands, so the number means something.
      var lo = (Math.floor((ids[0] - 1) / 100)) * 100 + 1, hi = Math.min(lo + 99, 2300);
      var c = KA_Kanji.counts(lo, hi);
      var pct = Math.round(100 * c.solid / c.total);

      var tiles = nowSolid.map(function (k) {
        return '<span class="kd-tile t-solid" style="--stamp:' + KA_Kanji.colour(k.id) + ';--stamp-fg:' + KA_Kanji.textOn(k.id) +
               ';--tilt:' + KA_Kanji.tilt(k.id) + 'deg">' + k.kanji + '</span>';
      }).concat(stillShaky.map(function (k) {
        return '<span class="kd-tile t-shaky">' + k.kanji + '</span>';
      })).join('');

      var done = $('kd-done');
      done.hidden = false;
      done.innerHTML =
        '<h3>' + right + ' / ' + ids.length + ' ' + tt('kd_right', 'right') + '</h3>' +
        '<p>' + nowSolid.length + ' ' + tt('kd_turned_solid', 'turned solid') +
          '. ' + tt('kd_block_now', 'Block') + ' ' + lo + '\u2013' + hi + ' ' +
          tt('kd_is_now', 'is now') + ' ' + pct + '% \u2014 ' + (c.total - c.solid) + ' ' +
          tt('kd_left', 'left') + '.</p>' +
        '<div class="kd-done-tiles">' + tiles + '</div>' +
        '<div class="kd-done-acts">' +
          '<a class="kd-go" href="/kanji">' + tt('kd_back_wall_btn', 'Back to the wall') + '</a>' +
          (stillShaky.length
            ? '<button type="button" class="kd-ghost" id="kd-again">' +
              tt('kd_again', 'Drill the') + ' ' + stillShaky.length + ' ' +
              tt('kd_again2', 'again') + '</button>'
            : '') +
        '</div>';

      $('drill-card-wrap').style.display = 'none';
      var again = $('kd-again');
      if (again) {
        again.addEventListener('click', function () {
          state.queue = stillShaky.map(function (k) { return k.id; });
          state.qIdx = 0; state.qResult = [];
          done.hidden = true;
          $('drill-card-wrap').style.display = '';
          paintStrip(); newQuestion();
        });
      }
      done.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    // ---------- controls ----------
    /* ---------- the range picker ---------- */

    function buildRangeOptions() {
      var sel = $('drill-range');
      if (!sel) return;
      function opt(value, label) {
        var o = document.createElement('option');
        o.value = value; o.textContent = label;
        sel.appendChild(o);
      }
      sel.innerHTML = '';
      opt('1-2300', tt('kd_r_all', 'Everything') + ' \u00b7 1\u20132300');
      opt('1-500', 'KLC 1\u2013500');
      opt('501-1200', 'KLC 501\u20131200');
      opt('1201-2300', 'KLC 1201\u20132300');

      var wrong = window.KA_Kanji ? KA_Kanji.idsWithStatus(1, 2300, 'shaky').length : 0;
      opt('wrong', tt('kd_r_wrong', 'Only the ones I\u2019ve got wrong') + ' \u00b7 ' + wrong);

      var g = document.createElement('optgroup');
      g.label = tt('kd_r_blocks', 'Blocks of 100');
      sel.appendChild(g);
      for (var a = 1; a <= 2300; a += 100) {
        var z = Math.min(a + 99, 2300);
        var o = document.createElement('option');
        o.value = a + '-' + z;
        o.textContent = a + '\u2013' + z;
        g.appendChild(o);
      }
      opt('custom', tt('kd_r_custom', 'Custom range\u2026'));
      sel.value = state.lo + '-' + state.hi;
    }

    function applyRange(value) {
      if (value === 'wrong') {
        state.onlyWrong = true;
        $('kd-custom').hidden = true;
      } else if (value === 'custom') {
        $('kd-custom').hidden = false;
        return;                       // wait for Apply
      } else {
        state.onlyWrong = false;
        $('kd-custom').hidden = true;
        var parts = value.split('-');
        state.lo = parseInt(parts[0], 10);
        state.hi = parseInt(parts[1], 10);
      }
      showPoolSize();
      newQuestion();
    }

    function showPoolSize() {
      var n = pool().length;
      // (The "N in range" readout used to sit here; the picker's own labels
      // already say the size, so it was noise and is gone.)
      // An empty pool would loop forever in newQuestion, so say so and stop.
      if (!n) {
        $('drill-question').textContent = '\u2014';
        $('drill-tag').textContent = tt('kd_r_empty', 'Nothing in that range yet');
      }
    }

    window.toggleSet = function () { /* the range chips were replaced by a select */ };

    // How you answer in Kanji → Keyword: type the keyword, or pick it from
    // four. Keyword → Kanji is pick-only (typing a kanji needs an IME), so the
    // toggle is disabled there rather than hidden — it stays in the same place.
    window.setAnswer = function (how) {
      state.answer = how === 'pick' ? 'pick' : 'type';
      try { localStorage.setItem('kanjiDrillAnswer', state.answer); } catch (e) {}
      paintAnswerToggle();
      newQuestion();
    };
    function paintAnswerToggle() {
      var pickOnly = state.mode !== 'kanji2keyword';
      document.querySelectorAll('.answer-chip').forEach(function (c) {
        var how = c.getAttribute('data-answer');
        c.classList.toggle('on', pickOnly ? how === 'pick' : how === state.answer);
        c.disabled = pickOnly;
      });
    }

    window.setMode = function (mode) {
      state.mode = mode;
      document.querySelectorAll('.mode-chip').forEach(function (c) {
        c.classList.toggle('on', c.getAttribute('data-mode') === mode);
      });
      try { localStorage.setItem('kanjiDrillMode', mode); } catch (e) {}
      paintAnswerToggle();
      newQuestion();
    };

    window.toggleSet = function (set) {
      var onCount = Object.keys(state.sets).filter(function (s) { return state.sets[s]; }).length;
      if (state.sets[set] && onCount === 1) {
        if (typeof showToast === 'function') showToast('At least one range must stay on', 'warning');
        return;
      }
      state.sets[set] = !state.sets[set];
      document.querySelectorAll('.set-chip').forEach(function (c) {
        var s = c.getAttribute('data-set');
        c.classList.toggle('on', !!state.sets[s]);
      });
      newQuestion();
    };

    window.checkDrillAnswer = checkDrillAnswer;
    window.skipDrill = skipDrill;

    window.resetDrill = function () {
      state.correct = 0; state.total = 0; state.streak = 0;
      state.missed = {};
      renderScores();
      renderMissed();
      newQuestion();
    };

    // ---------- wiring ----------
    function init() {
      if (!dataReady()) {
        $('drill-question').textContent = '…';
        $('drill-tag').textContent = 'Loading kanji data failed — refresh the page';
        return;
      }
      var input = $('drill-input');
      input.addEventListener('input', function () {
        if (!state.answered) $('drill-check').disabled = input.value.trim() === '';
        input.classList.remove('almost');
      });
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          if (state.answered) newQuestion();
          else checkDrillAnswer();
        }
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && state.answered && document.activeElement !== input) {
          newQuestion();
        }
      });
      $('drill-check').addEventListener('click', function () {
        if (state.answered) newQuestion();
      });
      try {
        var m = localStorage.getItem('kanjiDrillMode');
        if (m === 'keyword2kanji') { state.mode = m; document.querySelectorAll('.mode-chip').forEach(function (c) { c.classList.toggle('on', c.getAttribute('data-mode') === m); }); }
        if (localStorage.getItem('kanjiDrillAnswer') === 'pick') state.answer = 'pick';
      } catch (e) {}
      paintAnswerToggle();
      if (window.KA_Listen) {
        KA_Listen.attach($('drill-hear'), function () {
          return (state.current && window.kanjiReadingSpeech) ? window.kanjiReadingSpeech(state.current.item) : '';
        });
        if (window.KA_Speech && KA_Speech.onReady) KA_Speech.onReady(paintHear);
        if (window.KA_Azure && KA_Azure.listVoices) KA_Azure.listVoices().then(paintHear);
      }
      buildRangeOptions();
      $('drill-range').addEventListener('change', function () {
        applyRange(this.value);
      });
      $('kd-apply').addEventListener('click', function () {
        var a = parseInt($('kd-lo').value, 10) || 1;
        var z = parseInt($('kd-hi').value, 10) || 2300;
        if (a > z) { var t2 = a; a = z; z = t2; }
        state.lo = Math.max(1, Math.min(2300, a));
        state.hi = Math.max(1, Math.min(2300, z));
        state.onlyWrong = false;
        showPoolSize();
        newQuestion();
      });
      showPoolSize();

      // If the wall sent us here, drill exactly what it chose.
      if (window.KA_Kanji) {
        var q = KA_Kanji.takeQueue();
        if (q && q.ids && q.ids.length) {
          state.queue = q.ids;
          state.qLabel = q.label || '';
          enterRound();
          paintStrip();
        }
      }

      renderScores();
      newQuestion();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
  </script>

<script src='https://storage.ko-fi.com/cdn/scripts/overlay-widget.js'></script>
<script>
  kofiWidgetOverlay.draw('katsuyo_academy', {
    'type': 'floating-chat',
    'floating-chat.donateButton.text': 'Support Us',
    'floating-chat.donateButton.background-color': '#f45d22',
    'floating-chat.donateButton.text-color': '#fff'
  });
</script>

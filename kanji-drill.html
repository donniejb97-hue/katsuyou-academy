  <style>
    .drill-page { max-width: 720px; margin: 0 auto; padding: 2rem; }
    .drill-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .drill-scores { display: flex; gap: 0.75rem; align-items: stretch; }
    .drill-score-box { background: var(--ink); color: var(--paper); border-radius: 8px; padding: 0.6rem 1.1rem; text-align: center; min-width: 84px; }
    .drill-score-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.7; }
    .drill-score-value { font-size: 1.25rem; font-weight: 700; }
    .drill-score-box.streak .drill-score-value { color: var(--gold); }

    .drill-controls { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.5rem; }
    .drill-control-row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
    .drill-control-label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-light); min-width: 60px; }
    .drill-chip { border: 1.5px solid rgba(0,0,0,0.15); background: white; color: var(--text); padding: 0.45rem 1rem; border-radius: 999px; font-family: inherit; font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: all 0.15s; }
    .drill-chip:hover { border-color: var(--accent-soft); }
    .drill-chip.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }
    .drill-chip.on.set-chip { background: var(--sage); border-color: var(--sage); }

    .drill-card { background: white; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 2.5rem 2rem; text-align: center; margin-bottom: 1.25rem; position: relative; }
    .drill-question-tag { display: inline-block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); background: rgba(196,92,74,0.1); padding: 0.3rem 0.9rem; border-radius: 999px; margin-bottom: 1rem; }
    .drill-question { font-size: 5.5rem; line-height: 1.1; color: var(--ink); min-height: 6rem; }
    .drill-question.keyword-q { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 2.2rem; letter-spacing: 0.06em; min-height: 6rem; display: flex; align-items: center; justify-content: center; }
    .drill-klc-id { position: absolute; top: 1rem; right: 1.25rem; font-size: 0.75rem; color: var(--text-light); letter-spacing: 0.05em; }

    .drill-choices { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.75rem; margin-bottom: 1.25rem; }
    .drill-choice { background: white; border: 2px solid rgba(0,0,0,0.12); border-radius: 10px; padding: 0.75rem 0.5rem; font-size: 3rem; cursor: pointer; transition: all 0.15s; color: var(--ink); }
    .drill-choice:hover:not(:disabled) { border-color: var(--accent-soft); transform: translateY(-2px); }
    .drill-choice:disabled { cursor: default; }
    .drill-choice.correct { background: rgba(122,158,126,0.18); border-color: var(--sage); }
    .drill-choice.wrong { background: rgba(196,92,74,0.12); border-color: var(--accent); }
    .drill-choice.dim { opacity: 0.45; }

    .drill-answer-row { display: flex; gap: 0.75rem; margin-bottom: 1.25rem; }
    .drill-input { flex: 1; padding: 1rem 1.25rem; font-size: 1.3rem; border: 2px solid rgba(0,0,0,0.15); border-radius: 10px; font-family: 'Outfit', sans-serif; outline: none; text-align: center; letter-spacing: 0.04em; }
    .drill-input:focus { border-color: var(--accent); }
    .drill-input:disabled { background: var(--paper-warm); }
    .drill-input.correct { border-color: var(--sage); background: rgba(122,158,126,0.1); }
    .drill-input.wrong { border-color: var(--accent); background: rgba(196,92,74,0.08); }
    .drill-input.almost { border-color: #f9a825; animation: drill-shake 0.35s; }
    @keyframes drill-shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .drill-input.almost { animation: none; }
    }

    .drill-feedback { border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; display: none; text-align: center; }
    .drill-feedback.show { display: block; }
    .drill-feedback.good { background: rgba(122,158,126,0.15); border: 1px solid var(--sage); color: #3f5c42; }
    .drill-feedback.bad { background: rgba(196,92,74,0.1); border: 1px solid var(--accent-soft); color: #8a3d2f; }
    .drill-feedback.warn { background: rgba(249,168,37,0.14); border: 1px solid #f9a825; color: #7a5a10; font-weight: 500; }
    .drill-feedback .big { font-size: 1.35rem; margin-top: 0.25rem; }
    .drill-feedback .big .jp { font-size: 2rem; vertical-align: middle; margin-right: 0.35rem; }

    .drill-detail { margin-top: 0.85rem; padding-top: 0.85rem; border-top: 1px dashed rgba(0,0,0,0.15); font-size: 0.95rem; display: flex; flex-direction: column; gap: 0.3rem; color: inherit; }
    .drill-detail .row { display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap; }
    .drill-detail .lbl { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; opacity: 0.65; align-self: center; }
    .drill-detail ruby rt { font-size: 0.55em; opacity: 0.8; }

    .drill-actions { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    .drill-btn { flex: 1; padding: 1rem; font-family: inherit; font-size: 1rem; font-weight: 600; border-radius: 10px; border: none; cursor: pointer; transition: all 0.15s; min-width: 140px; }
    .drill-btn.primary { background: var(--accent); color: white; }
    .drill-btn.primary:hover:not(:disabled) { background: var(--accent-soft); }
    .drill-btn.primary:disabled { opacity: 0.45; cursor: default; }
    .drill-btn.ghost { background: white; border: 1.5px solid rgba(0,0,0,0.15); color: var(--text); }
    .drill-btn.ghost:hover { border-color: var(--accent-soft); }

    .drill-missed { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); padding: 1.5rem 2rem; margin-top: 2rem; display: none; }
    .drill-missed.show { display: block; }
    .drill-missed h2 { font-size: 1.1rem; color: var(--ink); margin-bottom: 0.75rem; }
    .drill-missed-list { display: flex; flex-wrap: wrap; gap: 0.6rem; }
    .drill-missed-chip { background: var(--paper-warm); border: 1px solid rgba(0,0,0,0.1); border-radius: 8px; padding: 0.4rem 0.8rem; font-size: 0.9rem; cursor: default; }
    .drill-missed-chip .jp { font-size: 1.5rem; margin-right: 0.45rem; vertical-align: middle; }
    .drill-missed-chip small { color: var(--text-light); }

    @media (max-width: 540px) {
      .drill-page { padding: 1.25rem; }
      .drill-question { font-size: 4rem; }
      .drill-question.keyword-q { font-size: 1.6rem; }
      .drill-choices { grid-template-columns: repeat(2, 1fr); }
    }

  <script>
  // ==========================================================================
  // KANJI DRILL — quiz engine over kanjiDataList (loaded by kanji-data.js)
  // ==========================================================================
  (function () {
    'use strict';

    var state = {
      mode: 'kanji2keyword',
      sets: { r1: true, r2: false, r3: false },
      correct: 0, total: 0, streak: 0, best: 0,
      current: null,
      answered: false,
      retried: false,
      missed: {}          // key: kanji char → item
    };

    var RANGES = { r1: [1, 500], r2: [501, 1200], r3: [1201, 2300] };

    try {
      var saved = localStorage.getItem('kanjiDrillBest');
      if (saved) state.best = parseInt(saved, 10) || 0;
    } catch (e) { /* storage unavailable — fine */ }

    function $(id) { return document.getElementById(id); }

    function dataReady() {
      return typeof kanjiDataList !== 'undefined' && kanjiDataList.length > 0;
    }

    function pool() {
      var out = [];
      Object.keys(RANGES).forEach(function (key) {
        if (!state.sets[key]) return;
        var lo = RANGES[key][0], hi = RANGES[key][1];
        for (var i = 0; i < kanjiDataList.length; i++) {
          var k = kanjiDataList[i];
          if (k.id >= lo && k.id <= hi) out.push(k);
        }
      });
      return out;
    }

    // "SUN ・ DAY ・ JAPAN" → ['sun', 'day', 'japan']
    function keywordParts(item) {
      return item.keyword.split('・').map(function (p) {
        return p.trim().toLowerCase();
      }).filter(Boolean);
    }

    function primaryKeyword(item) {
      return item.keyword.split('・')[0].trim();
    }

    // 日[ひ]にち → ruby markup
    function toRuby(word) {
      return word.replace(/([^\s\[\]]+)\[([^\]]+)\]/g, '<ruby>$1<rt>$2</rt></ruby>');
    }

    // ---------- "almost there" detection ----------
    function levenshtein(a, b) {
      if (a === b) return 0;
      var m = a.length, n = b.length;
      if (!m) return n;
      if (!n) return m;
      var row = [];
      for (var j = 0; j <= n; j++) row[j] = j;
      for (var i = 1; i <= m; i++) {
        var prev = row[0];
        row[0] = i;
        for (var k = 1; k <= n; k++) {
          var tmp = row[k];
          row[k] = Math.min(
            row[k] + 1,
            row[k - 1] + 1,
            prev + (a.charAt(i - 1) === b.charAt(k - 1) ? 0 : 1)
          );
          prev = tmp;
        }
      }
      return row[n];
    }

    // One letter off for short keywords, up to two for long ones.
    function isClose(val, item) {
      var parts = keywordParts(item);
      for (var i = 0; i < parts.length; i++) {
        var p = parts[i];
        var maxDist = p.length >= 7 ? 2 : 1;
        if (p.length >= 3 && levenshtein(val, p) <= maxDist) return true;
      }
      return false;
    }

    // ---------- question generation ----------
    function newQuestion() {
      if (!dataReady()) return;
      var p = pool();
      var item = p[Math.floor(Math.random() * p.length)];
      if (state.current && p.length > 3) {
        while (item.kanji === state.current.item.kanji) {
          item = p[Math.floor(Math.random() * p.length)];
        }
      }
      state.current = { item: item };
      state.answered = false;
      state.retried = false;

      $('drill-klc-id').textContent = 'KLC #' + item.id;

      var fb = $('drill-feedback');
      fb.className = 'drill-feedback';
      fb.innerHTML = '';

      if (state.mode === 'kanji2keyword') {
        $('drill-tag').textContent = 'What is the keyword?';
        var q = $('drill-question');
        q.className = 'drill-question jp';
        q.textContent = item.kanji;
        $('drill-type-row').style.display = 'flex';
        $('drill-choices').style.display = 'none';
        var input = $('drill-input');
        input.value = '';
        input.disabled = false;
        input.className = 'drill-input';
        input.focus();
        $('drill-check').style.display = 'block';
        $('drill-check').disabled = true;
        $('drill-check').textContent = 'Check Answer';
        $('drill-skip').style.display = 'block';
      } else {
        $('drill-tag').textContent = 'Pick the kanji';
        var q2 = $('drill-question');
        q2.className = 'drill-question keyword-q';
        q2.textContent = item.keyword;
        $('drill-type-row').style.display = 'none';
        $('drill-choices').style.display = 'grid';
        buildChoices(item, p);
        $('drill-check').style.display = 'none';
        $('drill-skip').style.display = 'block';
      }
    }

    function buildChoices(answer, p) {
      var distractors = [];
      var usedKanji = {};
      usedKanji[answer.kanji] = true;
      var usedKeyword = {};
      usedKeyword[primaryKeyword(answer).toLowerCase()] = true;
      var guard = 0;
      while (distractors.length < 3 && guard < 300) {
        guard++;
        var cand = p[Math.floor(Math.random() * p.length)];
        var pk = primaryKeyword(cand).toLowerCase();
        if (usedKanji[cand.kanji] || usedKeyword[pk]) continue;
        usedKanji[cand.kanji] = true;
        usedKeyword[pk] = true;
        distractors.push(cand);
      }
      var options = distractors.concat([answer]);
      for (var i = options.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = options[i]; options[i] = options[j]; options[j] = t;
      }
      var box = $('drill-choices');
      box.innerHTML = '';
      options.forEach(function (opt) {
        var b = document.createElement('button');
        b.className = 'drill-choice jp';
        b.textContent = opt.kanji;
        b.onclick = function () { chooseKanji(opt, b); };
        box.appendChild(b);
      });
    }

    // ---------- answering ----------
    function chooseKanji(opt, btn) {
      if (state.answered) return;
      state.answered = true;
      var item = state.current.item;
      var right = opt.kanji === item.kanji;
      var buttons = $('drill-choices').querySelectorAll('.drill-choice');
      buttons.forEach(function (b) {
        b.disabled = true;
        if (b.textContent === item.kanji) b.classList.add('correct');
        else if (b === btn) b.classList.add('wrong');
        else b.classList.add('dim');
      });
      record(right);
      showFeedback(right);
    }

    function checkDrillAnswer() {
      if (state.answered || state.mode !== 'kanji2keyword') return;
      var input = $('drill-input');
      var val = input.value.trim().toLowerCase().replace(/\s+/g, ' ').replace(/\.$/, '');
      if (!val) return;
      var item = state.current.item;
      var right = keywordParts(item).indexOf(val) !== -1;

      // Almost there? One more shot before revealing.
      if (!right && !state.retried && isClose(val, item)) {
        state.retried = true;
        input.classList.remove('almost');
        void input.offsetWidth; // restart the shake animation
        input.classList.add('almost');
        var fb = $('drill-feedback');
        fb.className = 'drill-feedback show warn';
        fb.innerHTML = '⚠️ So close — check your spelling and try once more!';
        input.select();
        input.focus();
        return;
      }

      state.answered = true;
      input.disabled = true;
      input.classList.remove('almost');
      input.classList.add(right ? 'correct' : 'wrong');
      record(right);
      showFeedback(right);
    }

    function skipDrill() {
      if (state.answered) return;
      state.answered = true;
      var item = state.current.item;
      if (state.mode === 'kanji2keyword') {
        $('drill-input').disabled = true;
      } else {
        var buttons = $('drill-choices').querySelectorAll('.drill-choice');
        buttons.forEach(function (b) {
          b.disabled = true;
          if (b.textContent === item.kanji) b.classList.add('correct');
          else b.classList.add('dim');
        });
      }
      record(false);
      showFeedback(false, true);
    }

    function record(right) {
      state.total++;
      if (right) {
        state.correct++;
        state.streak++;
        if (state.streak > state.best) {
          state.best = state.streak;
          try { localStorage.setItem('kanjiDrillBest', String(state.best)); } catch (e) {}
        }
      } else {
        state.streak = 0;
        var item = state.current.item;
        state.missed[item.kanji] = item;
        renderMissed();
      }
      renderScores();
    }

    function showFeedback(right, skipped) {
      var item = state.current.item;
      var fb = $('drill-feedback');
      fb.className = 'drill-feedback show ' + (right ? 'good' : 'bad');
      var head = right ? '⭕ Correct!' : (skipped ? 'Answer:' : '❌ Not quite — the answer is:');

      var on = (item.onyomi && item.onyomi.length) ? item.onyomi.join(' ・ ') : '—';
      var kun = item.kunyomi ? item.kunyomi : '—';
      var vocabHtml = '';
      if (item.vocabulary && item.vocabulary.length) {
        var v = item.vocabulary[0];
        vocabHtml = '<div class="row"><span class="lbl">VOCAB</span><span class="jp">' + toRuby(v.word) + '</span><span>' + v.meaning + '</span></div>';
      }

      fb.innerHTML =
        '<div>' + head + '</div>' +
        '<div class="big"><span class="jp">' + item.kanji + '</span><strong>' + item.keyword + '</strong></div>' +
        '<div class="drill-detail">' +
          '<div class="row"><span class="lbl">ON</span><span class="jp">' + on + '</span>' +
          '<span class="lbl">KUN</span><span class="jp">' + kun + '</span></div>' +
          vocabHtml +
        '</div>';

      var check = $('drill-check');
      check.style.display = 'block';
      check.disabled = false;
      check.textContent = 'Next Question →';
      check.focus();
      $('drill-skip').style.display = 'none';
    }

    function renderScores() {
      $('drill-correct').textContent = state.correct;
      $('drill-total').textContent = state.total;
      $('drill-streak').textContent = state.streak;
      $('drill-best').textContent = state.best;
    }

    function renderMissed() {
      var keys = Object.keys(state.missed);
      var box = $('drill-missed');
      if (!keys.length) { box.className = 'drill-missed'; return; }
      box.className = 'drill-missed show';
      var list = $('drill-missed-list');
      list.innerHTML = '';
      keys.forEach(function (ch) {
        var item = state.missed[ch];
        var chip = document.createElement('span');
        chip.className = 'drill-missed-chip';
        chip.title = 'ON: ' + ((item.onyomi || []).join('・') || '—') + '  KUN: ' + (item.kunyomi || '—');
        chip.innerHTML = '<span class="jp">' + item.kanji + '</span><small>' + item.keyword + ' · #' + item.id + '</small>';
        list.appendChild(chip);
      });
    }

    // ---------- controls ----------
    window.setMode = function (mode) {
      state.mode = mode;
      document.querySelectorAll('.mode-chip').forEach(function (c) {
        c.classList.toggle('on', c.getAttribute('data-mode') === mode);
      });
      newQuestion();
    };

    window.toggleSet = function (set) {
      var onCount = Object.keys(state.sets).filter(function (s) { return state.sets[s]; }).length;
      if (state.sets[set] && onCount === 1) {
        if (typeof showToast === 'function') showToast('At least one range must stay on', 'warning');
        return;
      }
      state.sets[set] = !state.sets[set];
      document.querySelectorAll('.set-chip').forEach(function (c) {
        var s = c.getAttribute('data-set');
        c.classList.toggle('on', !!state.sets[s]);
      });
      newQuestion();
    };

    window.checkDrillAnswer = checkDrillAnswer;
    window.skipDrill = skipDrill;

    window.resetDrill = function () {
      state.correct = 0; state.total = 0; state.streak = 0;
      state.missed = {};
      renderScores();
      renderMissed();
      newQuestion();
    };

    // ---------- wiring ----------
    function init() {
      if (!dataReady()) {
        $('drill-question').textContent = '…';
        $('drill-tag').textContent = 'Loading kanji data failed — refresh the page';
        return;
      }
      var input = $('drill-input');
      input.addEventListener('input', function () {
        if (!state.answered) $('drill-check').disabled = input.value.trim() === '';
        input.classList.remove('almost');
      });
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          if (state.answered) newQuestion();
          else checkDrillAnswer();
        }
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && state.answered && document.activeElement !== input) {
          newQuestion();
        }
      });
      $('drill-check').addEventListener('click', function () {
        if (state.answered) newQuestion();
      });
      renderScores();
      newQuestion();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
  </script>
